# hadolint config for the Nix check and lint-hadolint only (passed with -c).
# It lives here, not at the repo root, because hadolint reads ./.hadolint.yaml
# on its own, and the Hadolint-PR/Push workflows would pick it up.
#
# The workflows ignore rules per Dockerfile; this is their union:
#   DL3006 — always tag image version
#   DL3008 — pin apt package versions
#   DL3013 — pin pip package versions
#   DL3022 — COPY --from references a prior FROM alias
#   DL3042 — pip --no-cache-dir
ignored:
  - DL3006
  - DL3008
  - DL3013
  - DL3022
  - DL3042
