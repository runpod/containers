# FileBrowser Quantum config for the ComfyUI template. The admin password comes
# from FILEBROWSER_PASSWORD, which start.sh passes as FILEBROWSER_ADMIN_PASSWORD.
# In v2.0.0+ the listen port and proxy options live under the top-level `http`
# key; `server.port` is rejected and stops FileBrowser from starting.
server:
  # Relative by default, which would put it in start.sh's working directory on
  # the volume.
  cacheDir: "/tmp/filebrowser"
  sources:
    - path: "/workspace"
      config:
        defaultEnabled: true
  database:
    # Filename must not be "database.db" (reserved for the v1 legacy file), and
    # must not be filebrowser.db, which holds the classic FileBrowser database
    # on existing volumes. start.sh line-matches this path to add migrateFrom.
    path: "/workspace/runpod-slim/filebrowser.sqlite"
auth:
  adminUsername: admin
  methods:
    password:
      enabled: true
      minLength: 12
http:
  port: 8080
  # Scope the session JWT cookie to X-Forwarded-Host, not the pod internal IP,
  # so login works behind the Runpod proxy.
  trustProxyHeaders: true
