# vLLM API front door on 8001 for the inference variant, included into the
# base image's nginx http block. vLLM itself listens on 127.0.0.1:8000 only, so
# this is the one way in from outside the head pod, and it checks the key
# before vLLM sees the request: every route except /health and /ping needs
# `Authorization: Bearer <key>`, whatever routes vLLM adds. While vLLM isn't
# serving (the model is loading, or it was not started), requests get 503.
#
# The accepted header lives in vllm-api-key.map, written by
# /opt/runpod/inference/start; the shipped one accepts nothing.

map $http_authorization $vllm_authorized {
    include /etc/nginx/vllm-api-key.map;
}

map $http_upgrade $vllm_connection {
    default upgrade;
    "" close;
}

server {
    listen 8001;

    # Multimodal requests carry images and audio inline.
    client_max_body_size 100m;

    # Stream tokens as vLLM produces them, and let long generations run.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # The Realtime API is a WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vllm_connection;

    # nginx's own 502 (vLLM not listening); vLLM's own errors pass through.
    error_page 502 = @not_serving;
    error_page 401 = @unauthorized;

    # Health checks stay public, as with vLLM's own --api-key.
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ping {
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        if ($vllm_authorized = 0) {
            return 401;
        }
        proxy_pass http://127.0.0.1:8000;
    }

    location @unauthorized {
        default_type application/json;
        add_header WWW-Authenticate Bearer always;
        return 401 '{"error": "Unauthorized"}\n';
    }

    location @not_serving {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"error": "vLLM is not serving yet: the model may still be loading. See the head pod logs."}\n';
    }
}
