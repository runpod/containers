apiVersion: 1

# vLLM's example Grafana dashboards, vendored from vllm-project/vllm at the
# image's VLLM_VERSION (examples/observability/: prometheus_grafana/grafana.json
# and dashboards/grafana/*.json), retitled with a "vLLM" prefix and their export
# ids cleared, otherwise unchanged. They pick the Prometheus datasource
# through their DS_PROMETHEUS variable and read the head's `vllm` scrape job
# (post_start.sh).
providers:
  - name: vllm-dashboards
    orgId: 1
    folder: vLLM
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /opt/runpod/inference/grafana-dashboards
      foldersFromFilesStructure: false
