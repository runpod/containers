# Ray dashboard front door on 8266, included into the base image's nginx http
# block. The console opens `…-8266.proxy.runpod.net/?token=<cluster token>`,
# like Jupyter's `?token=` link. nginx holds no secret: it hands the token to
# Ray as Ray's own session cookie (what the UI's token prompt would set) and
# lets Ray check it, so a wrong token gets Ray's usual prompt. The redirect
# drops the token from the address bar. Everything else, including API clients
# sending `Authorization: Bearer`, passes straight through. On a Runpod head
# the redirect first bounces through Grafana's token proxy, so the Metrics
# tab's Grafana panels (another origin) are signed in too
# (ray-dashboard-login.conf).
#
# 8265 stays the dashboard itself, for the host's poll; map 8266, not 8265.
server {
    listen 8266;

    # The console link carries the cluster token in its query string, and the
    # default access log records the full request line.
    access_log off;

    # Relative Location: behind the Runpod proxy nginx sees plain http on 8266.
    absolute_redirect off;
    # Ray's own limit for job-submission uploads (DASHBOARD_CLIENT_MAX_SIZE).
    client_max_body_size 100m;
    # Sets $after_login, the redirect once ?token= has set the cookie.
    include /etc/nginx/ray-dashboard-login.conf;

    location / {
        # URL-safe tokens only: $arg_token is still percent-encoded, so any
        # other token would reach Ray mangled. Those fall through to the prompt.
        if ($arg_token ~ "^[A-Za-z0-9._~-]+$") {
            add_header Set-Cookie "ray-authentication-token=$arg_token; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax";
            return 302 $after_login;
        }
        proxy_pass http://127.0.0.1:8265;
        # Stream log views instead of buffering them whole.
        proxy_buffering off;
    }
}
