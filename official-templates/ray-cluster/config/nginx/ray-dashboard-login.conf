# Where the front door's `?token=` login redirects once it has set Ray's
# cookie: by default the same path without the token. On a Runpod head the
# entrypoint replaces this file so a login at `/` bounces through Grafana's
# token proxy (8889) first, which signs Grafana in for the dashboard's Metrics
# tab; deep links still return to their own path.
set $after_login $uri;
