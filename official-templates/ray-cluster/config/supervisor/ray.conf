; Ray node daemon, managed by supervisord. Dropped into
; /etc/supervisor/conf.d/ (included by the packaged
; /etc/supervisor/supervisord.conf), alongside the inherited pytorch-cluster
; monitoring programs (node_exporter, dcgm-exporter, prometheus, grafana).
;
; /ray-entrypoint.sh ends in `exec ray start ... --block`, so this program is
; the Ray head/worker process itself: supervisord restarts it on crash and, for
; a worker whose head isn't up yet, retries the registration (the entrypoint
; exits non-zero until the head GCS is reachable).
;
; autostart=true on every node — role (head vs worker) is decided inside the
; entrypoint from NODE_ROLE, not here. priority=15 starts Ray just before the
; exporters (priority=20) so the metrics endpoint is coming up as they begin.

[program:ray-node]
command=/ray-entrypoint.sh
autostart=true
autorestart=true
; Ray's head bringup (GCS + dashboard + agent) can take >10s on a cold node;
; require it to stay up 15s before supervisord calls the start "successful".
startsecs=15
; A worker whose head is slow to appear exits and is retried; give it plenty of
; attempts before supervisord gives up (600s head-wait budget per attempt lives
; in the entrypoint itself).
startretries=20
stopsignal=TERM
; Ray needs a beat to tear the raylet/GCS down cleanly on stop/restart.
stopwaitsecs=20
stdout_logfile=/var/log/supervisor/ray-node.log
stderr_logfile=/var/log/supervisor/ray-node.err
priority=15
