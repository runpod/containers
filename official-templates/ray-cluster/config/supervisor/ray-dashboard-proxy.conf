[program:ray-dashboard-proxy]
; Head-node only — shared-token reverse proxy in front of the Ray dashboard
; (:8266 -> 127.0.0.1:8265). The dashboard is unauthenticated job submission
; (ShadowRay, CVE-2023-48022), so the proxy fails closed: only requests with a
; valid ?token=/cookie (RAY_DASHBOARD_PASSWORD, else JUPYTER_PASSWORD) are
; forwarded. This makes 8266 the one dashboard port safe to expose through
; Runpod's proxy; the raw dashboard on 8265 stays unmapped. Started by
; /post_start.sh on the head.
command=python /opt/runpod/ray/dashboard-proxy
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/ray-dashboard-proxy.log
stderr_logfile=/var/log/supervisor/ray-dashboard-proxy.err
priority=36
