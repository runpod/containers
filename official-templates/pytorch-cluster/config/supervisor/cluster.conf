; Cluster monitoring daemons, managed by supervisord.
; Dropped into /etc/supervisor/conf.d/ (included by the packaged
; /etc/supervisor/supervisord.conf). supervisord owns process lifecycle —
; autorestart-on-crash and unified logging under /var/log/supervisor/.
;
; Exporters run on every node (autostart=true). Prometheus + Grafana are
; head-node only (autostart=false) and are started by /post_start.sh via
; `supervisorctl start` when the hostname is node-0.

[program:node_exporter]
; --collector.ethtool surfaces NIC hardware counters (off by default). On RoCE
; NICs the standard IB counters/ files are empty, so RDMA throughput comes from
; ethtool stats (rx/tx_vport_rdma_unicast_bytes, rx/tx_bytes_phy). The include
; filter keeps only byte/RDMA/error counters so we don't emit ~200 series/NIC.
command=/usr/local/bin/node_exporter --web.listen-address=:9100 --collector.ethtool --collector.ethtool.metrics-include=(_bytes|_bytes_phy|rdma|vport|out_of_buffer|_discards)
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/node_exporter.log
stderr_logfile=/var/log/supervisor/node_exporter.err
priority=20

[program:dcgm-exporter]
; Embedded DCGM mode (no separate nv-hostengine). Requires libdcgm
; (datacenter-gpu-manager-4) and NVIDIA GPUs visible in the container.
command=/usr/local/bin/dcgm-exporter -f /etc/dcgm-exporter/extended-counters.csv -a :9400
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stdout_logfile=/var/log/supervisor/dcgm-exporter.log
stderr_logfile=/var/log/supervisor/dcgm-exporter.err
priority=20

[program:alloy]
; Log shipper — runs on EVERY node (autostart=true, like the exporters). Tails
; the local Slurm logs and pushes them to the head-node Loki (node-0:3100).
; loki.write retries with backoff, so it self-heals if it starts before node-0's
; Loki is up — no ordering dependency. --server.http.listen-addr binds Alloy's
; own UI to loopback (never public); --storage.path holds the read positions/WAL.
command=/usr/local/bin/alloy run --disable-reporting --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/alloy.log
stderr_logfile=/var/log/supervisor/alloy.err
priority=20

[program:prometheus]
; Head-node only — started by /post_start.sh via `supervisorctl start`.
; Binds loopback so the scrape/query surface never leaves the host; Grafana
; reaches it at http://127.0.0.1:9090 (see config/provisioning datasource).
command=/usr/local/bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --web.listen-address=127.0.0.1:9090
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/prometheus.log
stderr_logfile=/var/log/supervisor/prometheus.err
priority=30

[program:loki]
; Log store — head-node only, started by /post_start.sh via `supervisorctl
; start`. Monolithic single-binary mode, filesystem storage under /var/lib/loki.
; Binds 0.0.0.0:3100 so compute-node Alloy can push to it; Grafana queries it
; over loopback 127.0.0.1:3100 (see the provisioned Loki datasource).
command=/usr/local/bin/loki -config.file=/etc/loki/loki.yaml
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/loki.log
stderr_logfile=/var/log/supervisor/loki.err
priority=30

[program:mariadb]
; Slurm accounting (slurmdbd) backend — head-node only, started by
; /post_start.sh via `supervisorctl start` AFTER it has initialised the datadir
; on /workspace and created the slurm_acct_db database + user. The run-user
; (`user=`), datadir, bind, and InnoDB settings all come from the config: the
; baked /etc/mysql/mariadb.conf.d/99-slurm-acct.cnf plus the runtime-rendered
; zz-slurm-acct-datadir.cnf (which sets datadir + user — mysql normally, or root
; when /workspace forbids chown). Binds loopback only.
command=/usr/sbin/mariadbd
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb.err
priority=25

[program:grafana]
; Head-node only — started by /post_start.sh via `supervisorctl start`.
command=/usr/share/grafana/bin/grafana server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/grafana.log
stderr_logfile=/var/log/supervisor/grafana.err
priority=30

[program:grafana-proxy]
; Head-node only — tiny shared-token reverse proxy in front of Grafana
; (:8889 -> 127.0.0.1:3300). Checks ?token= against JUPYTER_PASSWORD (reused from
; Jupyter) and injects the auth.proxy identity header only on match. Started by
; /post_start.sh.
command=python /opt/grafana-proxy/auth_proxy.py
autostart=false
autorestart=true
startsecs=5
stopsignal=TERM
stdout_logfile=/var/log/supervisor/grafana-proxy.log
stderr_logfile=/var/log/supervisor/grafana-proxy.err
priority=35
