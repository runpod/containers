apiVersion: 1

# Grafana queries the head-node Loki over loopback — Loki binds 0.0.0.0:3100
# (so compute-node Alloy shippers can reach it), which also covers 127.0.0.1.
# Prometheus stays the default datasource; Loki is added alongside it.
datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: false
    editable: true
