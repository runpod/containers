apiVersion: 1

# Grafana talks to the head-node Prometheus over loopback — the query surface
# never leaves the host (Prometheus binds 127.0.0.1:9090, see the supervisor
# program definition).
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: true
    editable: true
