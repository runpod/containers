[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
# Grafana binds loopback only; the shared-token proxy (auth_proxy.py) listens on
# :8889 and fronts it. Loopback bind makes the injected identity header
# unspoofable from outside (nothing can reach :3300 directly).
http_addr = 127.0.0.1
http_port = 3300

[analytics]
reporting_enabled = false
check_for_updates = false

[news]
# Remove the news feed from the landing page for a cleaner, branded experience.
news_feed_enabled = false

[dashboards]
# Land on the branded cluster home dashboard instead of Grafana's default
# "Welcome / getting started" page.
default_home_dashboard_path = /var/lib/grafana/dashboards/00-home.json

[security]
# There is NO usable admin login — access is only via the auth proxy. The login
# form and HTTP basic auth are disabled (below), and post_start.sh sets a random
# admin password so the built-in admin account is never admin/admin.
allow_embedding = true
# Behind the Runpod proxy the browser origin differs from Grafana's own host,
# which trips the CSRF check ("origin not allowed") on datasource queries.
# Trust the proxy's forwarded host; post_start.sh additionally sets
# GF_SERVER_ROOT_URL / GF_SECURITY_CSRF_TRUSTED_ORIGINS from the pod id.
csrf_additional_headers = X-Forwarded-Host

[auth]
# Only the auth proxy may authenticate — hide the username/password login form.
disable_login_form = true

[auth.basic]
# Disable HTTP basic auth so admin credentials can't be used via the API either.
enabled = false

[users]
default_theme = dark
auto_assign_org_role = Admin

# Auth is enforced by the front proxy (config/grafana-proxy/auth_proxy.py),
# which mirrors Jupyter's model: it checks the ?token= value (or its cookie)
# against the shared secret JUPYTER_PASSWORD (reused from Jupyter) and injects
# X-WEBAUTH-User ONLY on match. Grafana trusts that header solely from the
# loopback proxy (whitelist). No/invalid token -> no header -> login form.
[auth.proxy]
enabled = true
header_name = X-WEBAUTH-User
header_property = username
auto_sign_up = true
whitelist = 127.0.0.1
headers = Email:X-WEBAUTH-Email
enable_login_token = false
