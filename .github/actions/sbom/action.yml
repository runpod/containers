name: SBOM
description: >-
  Generate an SBOM for each built image with Syft, from the local Docker daemon
  (before push). Writes syft-json (consumed by the grype action), SPDX JSON
  (attested by the cosign action) and CycloneDX JSON, plus an index that maps
  each registry/image@sha256 digest ref to its files, adds a job summary and
  optionally uploads the SPDX/CycloneDX files as an artifact.

inputs:
  ref-digests:
    description: "JSON object mapping each image reference to its sha256 digest (image-name output `ref-digests`)"
    required: true
  platforms:
    description: >-
      Comma-separated platforms of a multi-platform image, e.g.
      "linux/amd64,linux/arm64": one SBOM per platform, which the cosign
      action attests to that platform's manifest. Empty: one SBOM per image.
    required: false
    default: ""
  artifact-name:
    description: >-
      Upload the SPDX and CycloneDX files under this artifact name:
      sbom-<family>, or sbom-<family>.<shard> for a matrix job (the release
      jobs download sbom-<family>{,.*}). Empty: no upload.
    required: false
    default: ""
  max-parallel:
    description: "Maximum number of Syft runs to execute concurrently"
    required: false
    default: "2"

outputs:
  dir:
    description: "Directory holding the generated SBOM files and index.json"
    value: ${{ steps.gen.outputs.dir }}
  index:
    description: >-
      Path to index.json: {"<registry/image@sha256:...>": {"ref", "sboms":
      [{"platform", "name", "syft", "spdx", "cdx"}]}}. Keys use the same form
      as image-name `digests`; platform is null for a single-platform image.
    value: ${{ steps.gen.outputs.index }}

runs:
  using: composite
  steps:
    # Pinned to the Syft version Grype v0.114.0 is built against
    # (github.com/anchore/syft v1.45.1 in grype's go.mod), so scanning the
    # SBOM gives the same package catalog Grype produced scanning the image
    # directly. Bump together with the grype action.
    - name: Install Syft
      shell: bash
      run: |
        set -euo pipefail
        version=1.45.1
        sha256=20c84195e24927f50a3b2269946be51f4c4abc9d2f145fee7388b4199149f716
        curl -fsSL "https://github.com/anchore/syft/releases/download/v${version}/syft_${version}_linux_amd64.tar.gz" \
          -o /tmp/syft.tar.gz
        echo "${sha256}  /tmp/syft.tar.gz" | sha256sum -c -
        tar xz -C /tmp -f /tmp/syft.tar.gz syft
        sudo mv /tmp/syft /usr/local/bin/syft
        syft version

    - name: Generate SBOMs
      id: gen
      shell: bash
      env:
        REF_DIGESTS: ${{ inputs.ref-digests }}
        PLATFORMS: ${{ inputs.platforms }}
        MAX_PARALLEL: ${{ inputs.max-parallel }}
        # Package-level SBOM only: no per-file metadata/digests and no
        # package->file "contains" relationships (every file dpkg/pip lists).
        # On runpod/base:2.1.0-ubuntu2404 this cuts SPDX from 26.5 MB to
        # 6.8 MB (CycloneDX 11.5 -> 3.7 MB) with the same 1869 packages and
        # identical Grype matches; the attestation is uploaded whole to Rekor.
        # package-file-ownership-overlap (used to drop duplicate packages)
        # is a separate setting and stays on.
        SYFT_FILE_METADATA_SELECTION: none
        SYFT_RELATIONSHIPS_PACKAGE_FILE_OWNERSHIP: "false"
      run: |
        set -uo pipefail
        out="${RUNNER_TEMP}/sbom"
        mkdir -p "${out}"

        # One SBOM per unique image digest (several tags can share one) and
        # platform. Key = tag stripped from the ref + "@" + digest, mirroring
        # how the image-name action builds `digests`, so the cosign action
        # can look each signed digest up directly.
        index="$(echo "${REF_DIGESTS}" | jq -c --arg out "${out}" --arg platforms "${PLATFORMS}" '
          def without_tag:
            split("/")[-1] as $name
            | if ($name | contains(":")) then sub(":[^:]*$"; "") else . end;
          ($platforms | split(",") | map(gsub("\\s"; "")) | map(select(. != ""))) as $p
          | (if ($p | length) == 0 then [null] else $p end) as $plats
          | to_entries
          | map({key: ((.key | without_tag) + "@" + .value), ref: .key})
          | group_by(.key)
          | map(.[0])
          | map(
              (.ref | sub("^docker\\.io/"; "") | gsub("/"; "-") | gsub(":"; "_")) as $base
              | {key: .key, value: {
                  ref: .ref,
                  sboms: [$plats[] as $plat
                    | ($base + (if $plat then "_" + ($plat | gsub("/"; "-")) else "" end)) as $name
                    | {
                        platform: $plat,
                        name: $name,
                        syft: "\($out)/\($name).syft.json",
                        spdx: "\($out)/\($name).spdx.json",
                        cdx:  "\($out)/\($name).cdx.json"
                      }]
                }})
          | from_entries')"

        # Flat list of (image, platform) jobs.
        mapfile -t jobs < <(echo "${index}" | jq -c 'to_entries[] | .key as $key | .value.ref as $ref
          | .value.sboms[] | . + {key: $key, ref: $ref}')
        count="$(echo "${index}" | jq 'length')"
        if [ "${#jobs[@]}" -eq 0 ]; then
          echo "No image digests to generate SBOMs for"
          exit 1
        fi
        echo "${index}" > "${out}/index.json"

        max_parallel="${MAX_PARALLEL:-2}"
        if ! [[ "${max_parallel}" =~ ^[1-9][0-9]*$ ]]; then
          echo "Invalid max-parallel='${max_parallel}', falling back to 2"
          max_parallel=2
        fi

        echo "Generating ${#jobs[@]} SBOM(s) for ${count} image(s), up to ${max_parallel} in parallel"

        tmpdir="$(mktemp -d)"
        gen_one() {
          local idx="$1" job="$2" ref platform source archive config got
          local log="${tmpdir}/${idx}.log"
          ref="$(echo "${job}" | jq -r .ref)"
          platform="$(echo "${job}" | jq -r '.platform // empty')"
          source="docker:${ref}"
          echo 1 > "${tmpdir}/${idx}.rc"
          if [ -n "${platform}" ]; then
            # Not `syft --platform docker:<ref>`: on a daemon without the
            # platform-aware inspect API (< 1.49; the runners have 1.48) Syft
            # sees the host platform, then pulls <ref> from the registry,
            # which before our push is missing or an older image, and
            # re-tags it locally. Export exactly this platform instead.
            archive="${tmpdir}/${idx}.tar"
            if ! docker save --platform "${platform}" -o "${archive}" "${ref}" >> "${log}" 2>&1; then
              return
            fi
            config="$(tar -xOf "${archive}" manifest.json | jq -r '.[0].Config')"
            got="$(tar -xOf "${archive}" "${config}" \
              | jq -r '[.os, .architecture, .variant // empty] | join("/")')"
            if [ "${got}" != "${platform}" ] && [ "${got%/*}" != "${platform}" ]; then
              echo "Asked for ${platform}, docker save exported ${got}" >> "${log}"
              rm -f "${archive}"
              return
            fi
            source="docker-archive:${archive}"
          fi
          # --scope squashed matches the grype action: packages present in
          # the final filesystem, not ones deleted in a later layer.
          if syft "${source}" \
              --source-name "${ref}" \
              --scope squashed \
              -o "syft-json=$(echo "${job}" | jq -r .syft)" \
              -o "spdx-json=$(echo "${job}" | jq -r .spdx)" \
              -o "cyclonedx-json=$(echo "${job}" | jq -r .cdx)" \
              >> "${log}" 2>&1; then
            echo 0 > "${tmpdir}/${idx}.rc"
          fi
          [ -z "${archive:-}" ] || rm -f "${archive}"
        }

        running=0
        for idx in "${!jobs[@]}"; do
          gen_one "${idx}" "${jobs[$idx]}" &
          running=$((running + 1))
          if [ "${running}" -ge "${max_parallel}" ]; then
            wait -n
            running=$((running - 1))
          fi
        done
        wait

        failed=()
        for idx in "${!jobs[@]}"; do
          job="${jobs[$idx]}"
          label="$(echo "${job}" | jq -r '.key + (if .platform then " (\(.platform))" else "" end)')"
          echo "::group::Syft — ${label}"
          cat "${tmpdir}/${idx}.log" 2>/dev/null
          if [ "$(cat "${tmpdir}/${idx}.rc" 2>/dev/null)" = "0" ]; then
            echo "${job}" | jq -r '.syft, .spdx, .cdx' \
              | while read -r f; do
                  printf '  %-90s %s\n' "$(basename "${f}")" "$(du -h "${f}" | cut -f1)"
                done
            jq -r '"  packages: \(.artifacts | length)"' "$(echo "${job}" | jq -r .syft)"
          else
            failed+=("${label}")
          fi
          echo "::endgroup::"
        done

        if [ ${#failed[@]} -gt 0 ]; then
          echo "::error::SBOM generation failed for:"
          printf '  - %s\n' "${failed[@]}"
          exit 1
        fi

        # Job summary: counts per package type for every image, then each
        # image's package list. A step summary is capped at 1 MiB, so a list
        # that would not fit is left out (the artifact has them all).
        summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
        mapfile -t syft_files < <(printf '%s\n' "${jobs[@]}" | jq -r .syft)
        types="$(jq -cs '[.[].artifacts[].type] | unique' "${syft_files[@]}")"
        {
          echo "### SBOM"
          echo
          echo "Syft $(syft version -o json | jq -r .version), package-level, ${count} image(s)."
          echo
          echo "| Image | Digest | Packages | $(echo "${types}" | jq -r 'join(" | ")') | SPDX | CycloneDX |"
          echo "|---|---|--:|$(echo "${types}" | jq -r 'map("--:") | join("|")')|--:|--:|"
          for job in "${jobs[@]}"; do
            jq -r --argjson types "${types}" \
                  --arg label "$(echo "${job}" | jq -r '(.ref | split("/")[-1]) + (if .platform then " (\(.platform))" else "" end)')" \
                  --arg digest "$(echo "${job}" | jq -r '.key | split("@sha256:")[1]')" \
                  --arg spdx "$(du -h "$(echo "${job}" | jq -r .spdx)" | cut -f1)" \
                  --arg cdx "$(du -h "$(echo "${job}" | jq -r .cdx)" | cut -f1)" '
              (.artifacts | group_by(.type) | map({(.[0].type): length}) | add // {}) as $by
              | "| `\($label)` | `\($digest[0:12])` | \(.artifacts | length) | "
                + ($types | map(($by[.] // 0) | tostring) | join(" | "))
                + " | \($spdx) | \($cdx) |"' "$(echo "${job}" | jq -r .syft)"
          done
          echo
        } >> "${summary}"

        limit=1000000
        omitted=0
        for job in "${jobs[@]}"; do
          jq -r --arg label "$(echo "${job}" | jq -r '(.ref | split("/")[-1]) + (if .platform then " (\(.platform))" else "" end)')" '
            def cell: tostring | gsub("\\|"; "\\|");
            "<details><summary><code>\($label)</code>: \(.artifacts | length) packages</summary>\n",
            "| Type | Package | Version |",
            "|---|---|---|",
            (.artifacts | sort_by(.type, (.name | ascii_downcase)) | .[]
              | "| \(.type) | \(.name | cell) | \(.version | cell) |"),
            "\n</details>\n"' "$(echo "${job}" | jq -r .syft)" > "${tmpdir}/list.md"
          used="$(wc -c < "${summary}" 2>/dev/null || echo 0)"
          if [ $((used + $(wc -c < "${tmpdir}/list.md") + 200)) -le "${limit}" ]; then
            cat "${tmpdir}/list.md" >> "${summary}"
          else
            omitted=$((omitted + 1))
          fi
        done
        if [ "${omitted}" -gt 0 ]; then
          echo "Package lists for ${omitted} SBOM(s) did not fit the job summary; they are in the SBOM artifact." >> "${summary}"
        fi

        echo "dir=${out}" >> "${GITHUB_OUTPUT}"
        echo "index=${out}/index.json" >> "${GITHUB_OUTPUT}"

    - name: Upload SBOM artifact
      if: inputs.artifact-name != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.gen.outputs.dir }}/*.spdx.json
          ${{ steps.gen.outputs.dir }}/*.cdx.json
        retention-days: 14
        if-no-files-found: error
        # Uploaded before push and cosign: "Re-run failed jobs" after a later
        # failure uploads the same name again.
        overwrite: true
