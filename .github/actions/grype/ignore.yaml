# Findings Grype must not fail the build on. Only for vulnerabilities we cannot
# act on: no fixed release exists, or the package comes from an upstream base
# image we do not build. Each entry says why and when to look again; delete it
# once a fixed image is available.

ignore:
  # ffmpeg 62.x bundled in nvcr.io/nvidia/pytorch, not the apt ffmpeg we install
  # and not a pip package. The advisory's only fix is an upstream commit, so no
  # release carries it and there is nothing to upgrade to. Review on the next
  # bump of the NVIDIA base image.
  - vulnerability: CVE-2026-75146
    package:
      name: ffmpeg
      type: binary

  # tar in the sandbox images is deliberately held at the 24.04 build: the
  # 26.04 one calls openat2, which gVisor does not implement, so `tar -x`
  # fails inside a sandbox (see sandbox-ubuntu/Dockerfile). Both "fixes" are
  # 26.04 builds we cannot take. Review when the runtime implements openat2
  # and the pin comes out.
  - vulnerability: CVE-2025-45582
    package:
      name: tar
      type: deb
  - vulnerability: CVE-2026-5704
    package:
      name: tar
      type: deb

  # coreutils is Essential in ubuntu:26.04 and the installed version is the
  # only one the release ships — 9.7-3ubuntu2.1 is from a later series, not
  # resolute or resolute-updates, so there is nothing to upgrade to and the
  # package cannot be removed. Review when 26.04 publishes a fixed build.
  - vulnerability: CVE-2025-5278
    package:
      name: coreutils
      type: deb
  - vulnerability: CVE-2026-56391
    package:
      name: coreutils
      type: deb

  # filelock is fixed in 4.2.1, but that requires Python >= 3.11, and base
  # still ships python3.10 (Ubuntu 22.04's system interpreter), capped at the
  # 3.x line (3.32.7). No fixed filelock exists for 3.10. Goes away with
  # CON-1619 (drop Ubuntu 22.04 / python3.10).
  - vulnerability: GHSA-v4x8-3wr5-3wq8
    package:
      name: filelock
      type: python
