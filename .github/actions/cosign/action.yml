name: Cosign
description: "Sign and verify Docker images with Cosign (keyless via GitHub OIDC)"

inputs:
  image-digests:
    description: "JSON array of image digests in registry/image@sha256:... format"
    required: true

runs:
  using: composite
  steps:
    - name: Sign and verify
      shell: bash
      env:
        IMAGE_DIGESTS: ${{ inputs.image-digests }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        IDENTITY_REGEX="^${SERVER_URL}/${REPOSITORY}/\.github/workflows/.+"
        OIDC_ISSUER="https://token.actions.githubusercontent.com"

        echo "${IMAGE_DIGESTS}" | jq -r '.[]' | while IFS= read -r ref; do
          [ -z "${ref}" ] && continue
          echo "::group::Sign ${ref}"
          cosign sign --yes "${ref}"
          echo "::endgroup::"

          # Docker Hub is eventually consistent: right after `cosign sign`
          # pushes the .sig tag, a read can still miss it ("no signatures
          # found"). Retry with backoff; a real signature or identity problem
          # still fails after the last attempt.
          echo "::group::Verify ${ref}"
          attempt=1
          max_attempts=5
          until cosign verify \
              --certificate-identity-regexp "${IDENTITY_REGEX}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              "${ref}"; do
            if (( attempt >= max_attempts )); then
              echo "::error::cosign verify failed for ${ref} after ${attempt} attempts"
              exit 1
            fi
            delay=$(( 5 * 2 ** (attempt - 1) ))
            echo "verify attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s"
            sleep "${delay}"
            attempt=$(( attempt + 1 ))
          done
          echo "::endgroup::"
        done
