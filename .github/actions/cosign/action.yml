name: Cosign
description: "Sign and verify Docker images with Cosign (keyless via GitHub OIDC)"

inputs:
  image-digests:
    description: "JSON array of image digests in registry/image@sha256:... format"
    required: true
  sbom-index:
    description: >-
      Optional path to the sbom action's index.json. When set, each signed
      digest also gets its SPDX SBOM attached as a keyless in-toto attestation
      (cosign attest --type spdxjson), stored as sha256-<digest>.att, and the
      attestation is verified. A digest with no SBOM in the index fails the step.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Sign and verify
      shell: bash
      env:
        IMAGE_DIGESTS: ${{ inputs.image-digests }}
        SBOM_INDEX: ${{ inputs.sbom-index }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        IDENTITY_REGEX="^${SERVER_URL}/${REPOSITORY}/\.github/workflows/.+"
        OIDC_ISSUER="https://token.actions.githubusercontent.com"

        if [ -n "${SBOM_INDEX}" ]; then
          {
            echo "### SBOM attestations"
            echo
            echo "| Image | Digest | SPDX | Verified | Rekor |"
            echo "|---|---|--:|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
        fi

        echo "${IMAGE_DIGESTS}" | jq -r '.[]' | while IFS= read -r ref; do
          [ -z "${ref}" ] && continue
          echo "::group::Sign ${ref}"
          cosign sign --yes "${ref}"
          echo "::endgroup::"

          echo "::group::Verify ${ref}"
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_REGEX}" \
            --certificate-oidc-issuer "${OIDC_ISSUER}" \
            "${ref}"
          echo "::endgroup::"

          if [ -n "${SBOM_INDEX}" ]; then
            sbom="$(jq -r --arg k "${ref}" '.[$k].spdx // empty' "${SBOM_INDEX}")"
            if [ -z "${sbom}" ] || [ ! -s "${sbom}" ]; then
              echo "::error::No SPDX SBOM in ${SBOM_INDEX} for ${ref}"
              exit 1
            fi

            size="$(du -h "${sbom}" | cut -f1)"
            echo "::group::Attest SBOM ${ref} (${size})"
            if ! attest_log="$(cosign attest --yes --type spdxjson --predicate "${sbom}" "${ref}" 2>&1)"; then
              printf '%s\n' "${attest_log}"
              exit 1
            fi
            printf '%s\n' "${attest_log}"
            log_index="$(sed -n 's/.*tlog entry created with index: \([0-9]*\).*/\1/p' <<< "${attest_log}" | tail -1)"
            echo "::endgroup::"

            # Smoke test, like `verify` above: also checks the attested
            # predicate is the SBOM we generated, not just that one exists.
            # A re-run can rebuild the same digest from cache, so the digest
            # may carry several attestations (one JSON line each); ours must
            # be among them.
            echo "::group::Verify SBOM attestation ${ref}"
            want="$(jq -cS . "${sbom}" | sha256sum | cut -d' ' -f1)"
            attestations="$(mktemp)"
            cosign verify-attestation \
              --type spdxjson \
              --certificate-identity-regexp "${IDENTITY_REGEX}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              "${ref}" > "${attestations}"
            got="$(jq -r '.payload' "${attestations}" | while IFS= read -r payload; do
                printf '%s' "${payload}" | base64 -d | jq -cS '.predicate' \
                  | sha256sum | cut -d' ' -f1
              done)"
            rm -f "${attestations}"
            if ! grep -qxF "${want}" <<< "${got}"; then
              echo "::error::Attested SBOM for ${ref} does not match ${sbom}"
              exit 1
            fi
            echo "Attested SBOM matches ${sbom}"
            echo "::endgroup::"

            tag="$(jq -r --arg k "${ref}" '.[$k].ref | split("/")[-1]' "${SBOM_INDEX}")"
            rekor="${log_index:+[${log_index}](https://search.sigstore.dev/?logIndex=${log_index})}"
            echo "| \`${tag}\` | \`$(cut -c1-12 <<< "${ref##*@sha256:}")\` | ${size} | ✅ | ${rekor:-n/a} |" \
              >> "${GITHUB_STEP_SUMMARY}"
          fi
        done
