name: Compute Version
description: >-
  Derive the next semantic version from the family's latest git tag and the
  Conventional Commits made since it. Produces the RELEASE_VERSION /
  RELEASE_SUFFIX values the docker-bake files consume, plus flags telling the
  caller whether to build and whether to publish a release.

inputs:
  family:
    description: >-
      Template family whose tag series to read, e.g. `base` or `comfyui`
      (tags `base-v1.3.1`). Empty reads the repo-wide `v1.3.1` series, so
      every image shares one version. A family with no tag yet starts at
      1.0.0 regardless of the bump level.
    required: false
    default: ""
  release-branch:
    description: "Branch whose pushes produce a real release."
    required: false
    default: "main"

outputs:
  version:
    description: "Semantic version without a leading v (e.g. 1.1.0)."
    value: ${{ steps.compute.outputs.version }}
  suffix:
    description: "Tag suffix: empty for releases, -rc.<pr> for PRs, -dev otherwise."
    value: ${{ steps.compute.outputs.suffix }}
  previous-version:
    description: >-
      This family's last RELEASED version, with no bump applied — e.g. 1.3.1.
      A dependent builds FROM it when this family is not rebuilt in the same
      run. EMPTY when the family has never been released: there is no
      published image to build FROM, so the caller must build it in this run.
    value: ${{ steps.compute.outputs.previous_version }}
  tag:
    description: "Git tag for the release (e.g. v1.1.0, or comfyui-v1.1.0)."
    value: ${{ steps.compute.outputs.tag }}
  bump:
    description: "Detected bump level: major | minor | patch | none."
    value: ${{ steps.compute.outputs.bump }}
  should-build:
    description: "'true' when the caller should build images for this event."
    value: ${{ steps.compute.outputs.should_build }}
  should-release:
    description: "'true' when the caller should publish a git tag + release."
    value: ${{ steps.compute.outputs.should_release }}

runs:
  using: composite
  steps:
    - id: compute
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        # We squash-merge, so the PR title becomes the single commit subject on
        # main. Deriving the RC bump from the title (not the branch commits)
        # makes the release-candidate version match what the merge will produce.
        # Body is JSON-encoded so a multiline PR description survives the env.
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY_JSON: ${{ toJSON(github.event.pull_request.body) }}
        FAMILY: ${{ inputs.family }}
        RELEASE_BRANCH: ${{ inputs.release-branch }}
      run: |
        set -euo pipefail

        # shellcheck source=detect-bump.sh
        source "${GITHUB_ACTION_PATH}/detect-bump.sh"
        # shellcheck source=resolve-version.sh
        source "${GITHUB_ACTION_PATH}/resolve-version.sh"

        # Make sure tags are present even on shallow-ish checkouts.
        git fetch --tags --force --quiet || true

        PREFIX=""
        [ -n "${FAMILY}" ] && PREFIX="${FAMILY}-"

        LATEST="$(latest_release_tag "${PREFIX}")"
        BASE="${LATEST#"${PREFIX}"v}"

        if [ "$EVENT_NAME" = "pull_request" ]; then
          # Squash merge: PR title → subject, PR body → commit body (footers).
          PR_BODY="$(printf '%s' "${PR_BODY_JSON:-null}" | jq -r 'if . == null then "" else . end')"
          BUMP="$(detect_bump "${PR_TITLE}"$'\n\n'"${PR_BODY}")"
        else
          # Full squash-commit message so a BREAKING CHANGE footer is honoured.
          # detect_bump still ignores body feat:/fix: lines.
          MESSAGE="$(git log -1 --pretty=format:'%B')"
          BUMP="$(detect_bump "$MESSAGE")"
        fi

        SHOULD_BUILD="false"
        SHOULD_RELEASE="false"
        SUFFIX=""

        case "$EVENT_NAME" in
          pull_request)
            # Preview the version the merge would produce. When there is no
            # releasable change (ci/chore/docs) we keep the base version — the
            # RC just carries an -rc suffix, no phantom version bump.
            SUFFIX="-rc.${PR_NUMBER:-0}"
            SHOULD_BUILD="true"
            ;;
          workflow_dispatch)
            SUFFIX="-dev"
            SHOULD_BUILD="true"
            ;;
          *)
            # push (or release) on the release branch.
            if [ "$BUMP" != "none" ]; then
              SHOULD_BUILD="true"
              SHOULD_RELEASE="true"
            fi
            ;;
        esac

        VERSION="$(next_version "$BASE" "$BUMP")"
        TAG="${PREFIX}v${VERSION}"

        {
          echo "version=${VERSION}"
          echo "suffix=${SUFFIX}"
          echo "previous_version=${BASE}"
          echo "tag=${TAG}"
          echo "bump=${BUMP}"
          echo "should_build=${SHOULD_BUILD}"
          echo "should_release=${SHOULD_RELEASE}"
        } >> "$GITHUB_OUTPUT"

        echo "Family:           ${FAMILY:-(all images share one version)}"
        echo "Previous release: ${BASE:-none — first release}${LATEST:+ (${LATEST})}"
        echo "Detected bump:    ${BUMP}"
        echo "Computed version: ${VERSION}${SUFFIX}"
        echo "should_build=${SHOULD_BUILD} should_release=${SHOULD_RELEASE}"
