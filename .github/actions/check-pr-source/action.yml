name: Check PR source branch
description: >-
  Fail unless the pull request comes from an allowed branch of this
  repository. Used to keep `main` reachable only through `develop` or a
  hotfix branch, so nothing unreviewed publishes to the public image repos.

inputs:
  allowed:
    description: >-
      Newline-separated shell glob patterns the PR's head branch may match,
      e.g. `develop` and `hotfix/*`.
    required: true

runs:
  using: composite
  steps:
    - name: Check the source branch
      shell: bash
      env:
        ALLOWED: ${{ inputs.allowed }}
        BASE_REF: ${{ github.base_ref }}
        HEAD_REF: ${{ github.head_ref }}
        # A fork can carry a branch named `develop`, so the name alone is not
        # enough to tell this repository's develop from someone else's.
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail

        # Printed in the job log, the error annotation and the run summary, so
        # the reason is visible without opening the logs.
        reject() {
          {
            echo "### This pull request does not follow the release process"
            echo
            echo "\`${HEAD_REF}\` cannot target \`${BASE_REF}\`: $1"
            echo
            echo "**Change the target branch of this PR to \`develop\`.**"
            echo "It reaches \`main\` with the next release."
            echo
            echo "Only an urgent fix that cannot wait goes straight to"
            echo "\`${BASE_REF}\`, and then from a \`hotfix/<name>\` branch cut off"
            echo "\`${BASE_REF}\`, not from a feature branch. GitHub's own Revert"
            echo "button is allowed too, it opens from \`revert-*\`."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::This PR does not follow the release process: ${HEAD_REF} cannot target ${BASE_REF} ($1). Retarget it to develop, or branch it as hotfix/<name> off ${BASE_REF}."
          exit 1
        }

        if [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
          reject "it comes from ${HEAD_REPO}, not ${GITHUB_REPOSITORY}"
        fi

        patterns=()
        while IFS= read -r p; do
          [ -n "${p}" ] && patterns+=("${p}")
        done <<< "${ALLOWED}"

        for p in "${patterns[@]}"; do
          # shellcheck disable=SC2254
          case "${HEAD_REF}" in
            ${p}) echo "${HEAD_REF} may target ${BASE_REF} (matched '${p}')"; exit 0 ;;
          esac
        done

        allowed_list="$(IFS=,; printf '%s' "${patterns[*]}" | sed 's/,/, /g')"
        reject "the only branches allowed there are ${allowed_list}"

