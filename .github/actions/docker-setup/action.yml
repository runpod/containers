name: 'Docker Setup'
description: 'Common Docker setup steps for Blacksmith builds'
inputs:
  dockerhub-username:
    description: 'Docker Hub username'
    required: true
  dockerhub-token:
    description: 'Docker Hub token'
    required: true
  max-parallelism:
    description: 'Maximum parallelism for Docker Build'
    required: false
    default: 8
  cache-key:
    description: >-
      Sticky-disk cache lineage key for this image family (e.g. runpod/containers/base).
      Trusted main builds use this key as-is. Pull requests and off-main dispatches
      get a `/pr` suffix so they cannot commit into the release cache lineage.
    required: true

runs:
  using: 'composite'
  steps:
    - name: Clear space to remove unused folders
      shell: bash
      run: |
        rm -rf /usr/share/dotnet
        rm -rf /opt/ghc
        rm -rf "/usr/local/share/boost"
        rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Enable containerd image store
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/docker
        if [ -f /etc/docker/daemon.json ]; then
          sudo jq '. + {features: ((.features // {}) + {"containerd-snapshotter": true})}' \
            /etc/docker/daemon.json \
            | sudo tee /etc/docker/daemon.json.new > /dev/null
          sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        else
          echo '{"features":{"containerd-snapshotter":true}}' \
            | sudo tee /etc/docker/daemon.json > /dev/null
        fi
        sudo systemctl restart docker
        for _ in $(seq 1 30); do
          docker info > /dev/null 2>&1 && break
          sleep 1
        done

    - name: Verify containerd image store is active
      shell: bash
      run: |
        set -euo pipefail
        docker version --format 'Server: {{.Server.Version}}'
        if docker info --format '{{.DriverStatus}}' | grep -q 'io.containerd.snapshotter'; then
          echo "OK: containerd snapshotter is active"
        else
          echo "FAIL: containerd snapshotter is NOT active; load: true will be slow"
          docker info --format '{{.DriverStatus}}'
          exit 1
        fi

    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Resolve sticky-disk cache key
      id: cache
      shell: bash
      env:
        FAMILY_KEY: ${{ inputs.cache-key }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        # PR jobs share sticky disks with main by default and can poison the
        # snapshot release builds hydrate from. Isolate untrusted writes:
        # https://docs.blacksmith.sh/blacksmith-caching/dependencies-sticky-disks
        if [ "$EVENT_NAME" != "pull_request" ] && [ "$REF" = "refs/heads/main" ]; then
          KEY="$FAMILY_KEY"
        else
          KEY="${FAMILY_KEY}/pr"
        fi
        echo "key=${KEY}" >> "$GITHUB_OUTPUT"
        echo "Sticky-disk cache key: ${KEY}"

    - name: Set up Docker Build
      uses: useblacksmith/setup-docker-builder@1e75355f81cbb3f93cba1eb5dd5e5b05110ca8f9 # v2.0.1
      with:
        max-parallelism: ${{ inputs.max-parallelism }}
        cache-key: ${{ steps.cache.outputs.key }}

    - name: Inspect buildx builder
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::docker buildx ls"
        docker buildx ls
        echo "::endgroup::"
        echo "::group::docker buildx inspect --bootstrap"
        docker buildx inspect --bootstrap
        echo "::endgroup::"
