name: Template Staleness Scraper

# Weekly check for upstream releases we do not yet ship (pytorch, comfyui,
# autoresearch, base, pytorch-cluster, filebrowser, k3s-node and the sandbox-*
# families; ray-cluster is detection-only and opens no PR).
# Opens a draft PR per stale family; the matrix is verified by the build CI on
# that PR. Rules live in .claude/staleness-playbook.md.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC. Scheduled runs use the default branch.
  workflow_dispatch:

# Only GITHUB_TOKEN is scoped here, and the one thing still using it is git:
# actions/checkout persists its credentials, so the agent's `git push` of the
# scraper branch goes out as GITHUB_TOKEN and needs contents: write. Everything
# else (PR create/edit, labels, reviewers) runs through `gh` on
# SCRAPER_PR_TOKEN, so no pull-requests or issues scope is needed here.
permissions:
  contents: write

env:
  PR_REVIEWER: bohdankanarskyi-runpod

concurrency:
  group: staleness-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: blacksmith-4vcpu-ubuntu-2404 # On the org IP allow list; ubuntu-latest is not.
    timeout-minutes: 45
    strategy:
      fail-fast: false # One stale family should not block the other.
      matrix:
        include:
          # pytorch needs more turns: it verifies wheels across many CUDA x
          # python combos plus companion versions. comfyui is lighter.
          - family: pytorch
            turns: 120
          - family: comfyui
            turns: 60
          - family: autoresearch
            turns: 60
          - family: base
            turns: 90
          - family: pytorch-cluster
            turns: 90
          # ray-cluster only reports: every pin needs a hand-resolved lock file.
          - family: ray-cluster
            turns: 50
          - family: filebrowser
            turns: 50
          # k3s-node pins three components, each with an amd64 and an arm64 sum.
          - family: k3s-node
            turns: 80
          - family: sandbox-ubuntu
            turns: 70
          - family: sandbox-browser
            turns: 70
          - family: sandbox-harbor
            turns: 70
          - family: sandbox-openclaw
            turns: 70
    steps:
      # Without the PAT, `gh pr create` runs as GITHUB_TOKEN, and GitHub does not
      # start workflows on a PR that token opened. The PR then carries zero checks
      # while its body talks about build and smoke CI, so nothing verifies the
      # bump a human is being asked to merge. Refuse to run instead.
      - name: Require the PR token
        env:
          HAVE_TOKEN: ${{ secrets.SCRAPER_PR_TOKEN != '' }}
        run: |
          if [ "$HAVE_TOKEN" != "true" ]; then
            echo "::error::SCRAPER_PR_TOKEN is not set. The scraper would open PRs that no CI ever runs on; set the secret (a PAT or app token with repo write) and re-run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Always work off develop: the scraper branches from it and opens its
          # PRs into it. The workflow itself is read from the default branch
          # (main), which is where the cron and workflow_dispatch fire.
          ref: develop
          fetch-depth: 0

      - name: Scan ${{ matrix.family }}
        id: scan
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6
        env:
          # PAT/app token so Claude's PR triggers the build CI. The default
          # GITHUB_TOKEN cannot trigger other workflows, so the matrix would
          # never get verified. Required: see the preflight step above.
          GH_TOKEN: ${{ secrets.SCRAPER_PR_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Authenticate with our own token rather than the Claude GitHub App.
          github_token: ${{ secrets.SCRAPER_PR_TOKEN }}
          show_full_output: true
          prompt: |
            Read .claude/staleness-playbook.md and follow it exactly, but
            only for the `${{ matrix.family }}` family; ignore the others.
            Use the GH_TOKEN env var for all `gh` commands. Open the PR as a draft.
            If ${{ matrix.family }} is already current, make no edits to it --
            but still run the playbook's checks on any PR this job already has
            open for it, which is not the same as having nothing to do.

            Your LAST action, on every path through this task, is to write
            /tmp/scraper-status with the Write tool: exactly `ok` if you got to
            the end (PR opened, PR updated, nothing to do, or a detection-only
            family reported to the summary), or `failed: <one-line reason>` if
            something blocked you. Finding nothing to do is `ok`, not a failure.
            Do not end your turn before this file is written: the job has no
            other signal and fails the run when it is missing.
          claude_args: |
            --model claude-opus-4-8
            --max-turns ${{ matrix.turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh release view:*),Bash(gh release list:*),Bash(gh label create:*),Bash(curl:*),Bash(sha256sum:*),Bash(docker buildx bake:*),Bash(docker buildx imagetools:*),Bash(pip index:*),Bash(echo:*)"

      # The status file is the agent's own verdict and stays authoritative: a run
      # that ends without one tells us nothing about what it did or half-did, so
      # it is a failure either way. The agent step's outcome only names the cause,
      # separating "the agent died" (crash, max-turns) from "it finished but never
      # reported", which are fixed in completely different places.
      - name: Require a clean agent outcome
        if: always()
        shell: bash
        env:
          FAMILY: ${{ matrix.family }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          status="$(cat /tmp/scraper-status 2>/dev/null || echo 'missing (agent did not report)')"
          echo "::notice::${FAMILY} scraper status: ${status} (agent step: ${SCAN_OUTCOME})"
          if [ "$status" != "ok" ]; then
            if [ "$SCAN_OUTCOME" != "success" ]; then
              echo "::error::${FAMILY}: the agent step itself ended '${SCAN_OUTCOME}' (crash, timeout or max-turns); status file: ${status}"
            else
              echo "::error::${FAMILY}: the agent finished but did not report: ${status}. It ignored the status-file instruction, so what it changed is unverified."
            fi
            exit 1
          fi
