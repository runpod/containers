# TEMPORARY (CON-1467): builds and pushes the runpod/sageattention builder
# images once, using this repo's Docker Hub OIDC login, so their digests can be
# pinned in runpod/sageattention. Delete this file after copying the digests
# from the job summary.
name: TEMP sageattention builder images

on:
  push:
    branches:
      - feat/CON-1467-sageattention
    paths:
      - .github/workflows/tmp-sageattention-builder-images.yml

permissions:
  contents: read

concurrency:
  group: tmp-sageattention-builder-images
  cancel-in-progress: false

env:
  # runpod/sageattention feat/CON-1467-cu132-torch2.13
  SAGEATTENTION_SHA: da221c23ca16e229d8eded602a76791a05e01b7c
  IMAGE_REPOSITORY: runpod/sageattention-wheel-builder

jobs:
  builder:
    name: builder-${{ matrix.variant }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [cu128, cu130, cu132]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Checkout runpod/sageattention
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: runpod/sageattention
          ref: ${{ env.SAGEATTENTION_SHA }}
          path: sageattention

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: runpod/containers/tmp-sageattention-builder

      - name: Build and push builder-${{ matrix.variant }}
        working-directory: sageattention
        run: |
          set -euo pipefail
          IMAGE_TAG="bootstrap-${SAGEATTENTION_SHA:0:12}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"
          IMAGE_TAG="${IMAGE_TAG}" docker buildx bake -f docker/docker-bake.hcl \
            "builder-${{ matrix.variant }}" --push

      - name: Print digest
        run: |
          set -euo pipefail
          ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}-${{ matrix.variant }}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "${{ matrix.variant }}: ${IMAGE_REPOSITORY}@${digest}"
          echo "${{ matrix.variant }}: \`${IMAGE_REPOSITORY}@${digest}\` (tag \`${ref}\`)" >> "${GITHUB_STEP_SUMMARY}"
