name: "TEMP: gpu-compat via instances"

# ============================================================================
# TEMPORARY — DELETE BEFORE MERGING THIS BRANCH.
#
# gpu-compatibility.yml is workflow_dispatch-only, and GitHub does not show
# a dispatch button for a workflow that isn't on the default branch yet. This
# file exists to exercise the same steps from a branch push: the Normalize /
# Validate / Summarize shell is copied verbatim, with `inputs.X` swapped for
# `env.X` so the values are hardcoded below instead of typed into a form.
#
# Trigger: pushing a change to THIS file. Nothing else runs it, so ordinary
# commits on the branch don't spend money. To run it again without editing,
# use "Re-run all jobs" on the run in the Actions tab.
#
# Covers: multi-image splitting, explicit `instances`, cloud tier, and the
# mutual-exclusion guard.
#
# `instances` is a fallback chain, not a matrix — so this is 2 pods (one per
# image), each landing on the first listed GPU with capacity.
#
# Cost: 2 pods, ~7 min each, ~$0.25/hr -> about $0.06.
# ============================================================================

on:
  push:
    paths:
      - .github/workflows/zz-temp-gpu-compat-instances.yml

permissions:
  contents: read

concurrency:
  group: zz-temp-gpu-compat-instances
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # ---- stand-ins for the dispatch inputs -------------------------------
      IN_IMAGE: >-
        runpod/pytorch:1.2.0-rc.162-cu1281-torch2121-ubuntu2204,
        runpod/pytorch:1.2.0-rc.162-cu1290-torch2130-ubuntu2404
      IN_TEST_PORTS: ""
      IN_CUDA_VERSIONS: ""
      IN_EXCLUDE_INSTANCES: ""
      IN_CLOUD: SECURE
      # Both are SECURE and ~$0.25/hr, and both names contain a space, which
      # is what the --instance argv loop has to keep intact.
      IN_INSTANCES: "RTX A4000, RTX A4500"
      IN_CHECK_ALL_GPU: "false"
      IN_TEST_JUPYTER: "true"
      IN_TEST_COMFYUI: "false"
      IN_TEST_COMFYUI_FUNCTIONAL: "false"
      MAX_PARALLEL: "2"
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Normalize inputs
        id: prep
        shell: bash
        env:
          IMAGE: ${{ env.IN_IMAGE }}
          PORTS: ${{ env.IN_TEST_PORTS }}
          EXCLUDE: ${{ env.IN_EXCLUDE_INSTANCES }}
          INSTANCES: ${{ env.IN_INSTANCES }}
        run: |
          set -euo pipefail

          to_lines() {
            printf '%s' "$1" \
              | tr ',' '\n' \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
              | grep -v '^$' || true
          }

          emit_multiline() {
            {
              echo "$1<<__GH_EOF__"
              to_lines "$2"
              echo "__GH_EOF__"
            } >> "$GITHUB_OUTPUT"
          }

          IMAGES_CSV=$(printf '%s' "${IMAGE}" | tr -d '[:space:]')
          if [[ -z "${IMAGES_CSV}" ]]; then
            echo "::error::image input is empty"
            exit 1
          fi
          refs_json=""
          refs_human=""
          image_count=0
          while IFS= read -r ref; do
            [[ -z "${ref}" ]] && continue
            if [[ ! "${ref}" =~ ^[A-Za-z0-9._:/@-]+$ ]]; then
              echo "::error::image '${ref}' has characters that aren't valid in an image ref"
              exit 1
            fi
            if [[ "${ref}" != *:* ]]; then
              echo "::error::image '${ref}' has no tag — pass an explicit tag, not a bare repository"
              exit 1
            fi
            refs_json+="${refs_json:+,}\"${ref}\""
            refs_human+="${refs_human:+, }${ref}"
            image_count=$((image_count + 1))
          done <<< "$(printf '%s' "${IMAGES_CSV}" | tr ',' '\n')"
          printf 'image-refs=[%s]\n' "${refs_json}" >> "$GITHUB_OUTPUT"
          printf 'images=%s\n' "${refs_human}" >> "$GITHUB_OUTPUT"
          printf 'image-count=%s\n' "${image_count}" >> "$GITHUB_OUTPUT"

          emit_multiline ports "$(printf '%s' "${PORTS}" | tr ' ' ',')"
          emit_multiline exclude "${EXCLUDE}"
          emit_multiline instances "${INSTANCES}"

      - name: Validate inputs
        shell: bash
        env:
          CUDA: ${{ env.IN_CUDA_VERSIONS }}
          INSTANCES: ${{ env.IN_INSTANCES }}
          CHECK_ALL: ${{ env.IN_CHECK_ALL_GPU }}
        run: |
          set -euo pipefail
          instances_trimmed=$(printf '%s' "${INSTANCES}" | tr -d '[:space:]')
          if [[ -n "${instances_trimmed}" && "${CHECK_ALL,,}" == "true" ]]; then
            echo "::error::choose one: 'instances' lists exact GPUs, 'check-all-gpu' sweeps the catalog. An explicit list wins in the harness, so check-all-gpu would be silently ignored. Clear the instances field, or untick check-all-gpu."
            exit 1
          fi
          if [[ -z "${instances_trimmed}" && "${CHECK_ALL,,}" != "true" ]]; then
            echo "::error::nothing to test: set 'instances', or tick 'check-all-gpu'."
            exit 1
          fi
          if [[ -n "${CUDA}" && "${CUDA,,}" != "all" ]]; then
            normalized=$(printf '%s' "${CUDA}" | tr -d '[:space:]')
            [[ "${normalized}" =~ ^[0-9]+\.[0-9]+(,[0-9]+\.[0-9]+)*$ ]] \
              || { echo "::error::cuda-versions must be 'all' or X.Y[,X.Y...] (e.g. '12.8, 13.0'), got '${CUDA}'"; exit 1; }
          fi

      # TEMP-only: the mutual exclusion is enforced twice — by the Validate
      # step above and by the generator the composite action calls. Assert
      # the generator half here, since no run can exercise both branches.
      - name: Assert instances + check-all-gpu is rejected
        shell: bash
        run: |
          set -uo pipefail
          out=$(python3 .github/scripts/generate_test_manifest.py \
            --profile gpu --refs '["runpod/pytorch:1.2.0-rc.162-cu1281-torch2121-ubuntu2204"]' \
            --instance "RTX A4000" --check-all-gpu \
            --output "${RUNNER_TEMP}/should-not-exist.yaml" 2>&1) && rc=0 || rc=$?
          echo "${out}"
          if [[ "${rc}" -eq 0 ]]; then
            echo "::error::generator accepted --instance together with --check-all-gpu"
            exit 1
          fi
          echo "OK: generator exited ${rc}"

      - name: Summarize run parameters
        shell: bash
        env:
          IMAGES: ${{ steps.prep.outputs.images }}
          IMAGE_COUNT: ${{ steps.prep.outputs.image-count }}
          PORTS: ${{ steps.prep.outputs.ports }}
          EXCLUDE: ${{ steps.prep.outputs.exclude }}
          INSTANCES: ${{ steps.prep.outputs.instances }}
          CUDA: ${{ env.IN_CUDA_VERSIONS }}
          CLOUD: ${{ env.IN_CLOUD }}
          CHECK_ALL: ${{ env.IN_CHECK_ALL_GPU }}
          MAX_PARALLEL: ${{ env.MAX_PARALLEL }}
          JUPYTER: ${{ env.IN_TEST_JUPYTER }}
        run: |
          set -euo pipefail
          ports_1l=$(printf '%s' "${PORTS}" | paste -sd, - | sed 's/,/, /g')
          exclude_1l=$(printf '%s' "${EXCLUDE}" | paste -sd, - | sed 's/,/, /g')
          instances_1l=$(printf '%s' "${INSTANCES}" | paste -sd, - | sed 's/,/, /g')
          {
            echo "### TEMP: gpu-compat via explicit instances"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Images (${IMAGE_COUNT}) | \`${IMAGES//, /\`, \`}\` |"
            echo "| GPUs | ${instances_1l:-whole catalog (check-all-gpu=${CHECK_ALL})} |"
            echo "| Cloud tier | ${CLOUD} |"
            echo "| CUDA axis | ${CUDA:-none (floor from tag)} |"
            echo "| Ports | ${ports_1l:-none} |"
            echo "| Excluded GPUs | ${exclude_1l:-none} |"
            echo "| Jupyter | ${JUPYTER} |"
            echo "| Parallel pods | ${MAX_PARALLEL} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run compatibility matrix
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.prep.outputs.image-refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}

          check-all-gpu: ${{ env.IN_CHECK_ALL_GPU }}
          instances: ${{ steps.prep.outputs.instances }}
          exclude-instances: ${{ steps.prep.outputs.exclude }}
          min-vram-gb: "0"
          cloud-type: ${{ env.IN_CLOUD }}
          cuda-versions: ${{ env.IN_CUDA_VERSIONS }}

          test-ports: ${{ steps.prep.outputs.ports }}
          test-jupyter: ${{ env.IN_TEST_JUPYTER }}
          test-comfyui: ${{ env.IN_TEST_COMFYUI }}
          test-comfyui-functional: ${{ env.IN_TEST_COMFYUI_FUNCTIONAL }}

          upload-results-json: "true"
          results-artifact-name: zz-temp-instances-${{ github.run_id }}

          on-skip: pass
          create-timeout: "1200"
          max-parallel: ${{ env.MAX_PARALLEL }}
