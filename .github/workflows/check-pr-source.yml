name: Check PR Source

# Unit tests for .github/actions/check-pr-source. The action itself runs as
# `pr-source` in branch-policy.yml on every PR into main.

on:
  pull_request:
    paths:
      - ".github/actions/check-pr-source/**"
      - ".github/workflows/check-pr-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-subjects:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: commit-subjects unit tests
        run: bash .github/actions/check-pr-source/test_commit-subjects.sh
