name: Docker Hub Tag Cleanup

# Prunes ephemeral image tags from Docker Hub once they age out:
#   * -rc.<PR#>   release-candidate images built for pull requests
#   * -dev / -dev-* images built by manual (workflow_dispatch) runs
# Release tags (e.g. 1.2.3-ubuntu2204, 1.2.3-cuda1281-ubuntu2404) and `latest`
# are never eligible — the delete filter only matches the -rc./-dev markers.
#
# It also removes orphaned Cosign signatures (`sha256-<digest>.sig` / `.att`):
# a signature is deleted only when no live image tag still references its
# digest, so signatures of retained release images are always kept.
#
# Triggers:
#   * schedule          weekly sweep (actually deletes)
#   * workflow_dispatch  manual run (dry-run by default; flip the input to delete)
#   * workflow_call      so release.yml can run it right after cutting a release
#                        (add once #138 lands; see README/RELEASE docs)

on:
  # TEMPORARY (remove before merging TEM-13): run the sweep on this PR to
  # smoke-test it end-to-end. pull_request is a non-schedule event, so DRY_RUN
  # defaults to true below — this preview never deletes anything.
  pull_request:
    paths:
      - ".github/workflows/cleanup.yml"
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true
      retention_days:
        description: "Delete ephemeral tags older than this many days"
        type: string
        default: "14"
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      retention_days:
        type: string
        default: "14"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: dockerhub-tag-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Prune ephemeral Docker Hub tags
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Must be a Docker Hub access token with DELETE permission on the
          # runpod/* repos. A read/write push token is NOT enough — the DELETE
          # calls below will 401/403 and fail the job.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RETENTION: ${{ inputs.retention_days }}
        run: |
          set -euo pipefail

          NAMESPACE="runpod"
          REPOS=(base pytorch nvidia-pytorch autoresearch pytorch-cluster)

          RETENTION_DAYS="${INPUT_RETENTION:-14}"
          # A scheduled run has no inputs and should actually delete. A manual
          # run defaults to dry-run so an operator can preview first. A caller
          # (workflow_call) passes its own value.
          if [ "$EVENT" = "schedule" ]; then
            DRY_RUN="false"
          else
            DRY_RUN="${INPUT_DRY_RUN:-true}"
          fi

          CUTOFF=$(date -u -d "${RETENTION_DAYS} days ago" +%s)
          echo "Dry run: ${DRY_RUN} | retention: ${RETENTION_DAYS} days | cutoff: $(date -u -d @"${CUTOFF}")"

          # Try to exchange username + token for a short-lived management JWT.
          # Deletion REQUIRES it (and a token type allowed to delete tags, which
          # PAT/OAT are not — see RELEASE docs). Listing public repos works
          # WITHOUT it, so a dry-run can still preview what would be deleted even
          # if login fails. Keep this soft (no -f / || true) so a 401 does not
          # abort the whole script under `set -e -o pipefail`.
          LOGIN_RESP=$(curl -sS -H "Content-Type: application/json" \
            -d "{\"username\": \"${DOCKERHUB_USERNAME}\", \"password\": \"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ 2>/dev/null || true)
          TOKEN=$(printf '%s' "${LOGIN_RESP}" | jq -r '.token // empty' 2>/dev/null || true)
          if [ -z "${TOKEN}" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning::Docker Hub login failed; continuing unauthenticated (dry-run previews public repos only)"
            else
              echo "::error::Docker Hub login failed and this is not a dry-run — cannot delete."
              exit 1
            fi
          fi

          # GET with the JWT when we have one, anonymously otherwise (public repos).
          api_get() { # <url>
            if [ -n "${TOKEN}" ]; then
              curl -fsS -H "Authorization: JWT ${TOKEN}" "$1"
            else
              curl -fsS "$1"
            fi
          }

          del() { # <repo> <tag>
            if [ "${DRY_RUN}" = "true" ]; then
              echo "[dry-run] would delete ${NAMESPACE}/$1:$2"
            else
              echo "deleting ${NAMESPACE}/$1:$2"
              curl -fsS -X DELETE -H "Authorization: JWT ${TOKEN}" \
                "https://hub.docker.com/v2/repositories/${NAMESPACE}/$1/tags/$2/"
            fi
          }

          scanned=0 img_del=0 sig_del=0 kept=0
          for repo in "${REPOS[@]}"; do
            echo "::group::${NAMESPACE}/${repo}"

            # Snapshot every tag once (name, manifest digest, last_updated) so
            # we can make two passes over the same data.
            tags="$(mktemp)"
            url="https://hub.docker.com/v2/repositories/${NAMESPACE}/${repo}/tags/?page_size=100"
            while [ -n "${url}" ] && [ "${url}" != "null" ]; do
              resp=$(api_get "${url}")
              echo "${resp}" | jq -r '.results[] | [.name, (.digest // ""), .last_updated] | @tsv' >> "${tags}"
              url=$(echo "${resp}" | jq -r '.next // empty')
            done

            # Pass 1: delete aged-out ephemeral image tags (-rc./-dev). Record
            # the digest of every tag we KEEP so pass 2 can tell which cosign
            # signatures still back a live image.
            declare -A LIVE=()
            del_images=()
            while IFS=$'\t' read -r name digest updated; do
              [ -z "${name}" ] && continue
              scanned=$((scanned + 1))
              case "${name}" in
                *.sig|*.att) continue ;; # signatures handled in pass 2
              esac
              eligible=false
              case "${name}" in *-rc.*|*-dev|*-dev-*) eligible=true ;; esac
              ts=$(date -u -d "${updated}" +%s 2>/dev/null || echo 0)
              if [ "${eligible}" = "true" ] && [ "${ts}" -lt "${CUTOFF}" ]; then
                del_images+=("${name}")
              else
                kept=$((kept + 1))
                [ -n "${digest}" ] && LIVE["${digest#sha256:}"]=1
              fi
            done < "${tags}"

            # Pass 2: a cosign signature is tagged `sha256-<digest>.sig`/`.att`.
            # If <digest> is no longer backed by a live image tag (we just
            # deleted it, or it went in a previous run) the signature is
            # orphaned and safe to remove; release signatures stay in LIVE.
            del_sigs=()
            while IFS=$'\t' read -r name digest updated; do
              [ -z "${name}" ] && continue
              case "${name}" in
                *.sig|*.att) : ;;
                *) continue ;;
              esac
              hex="${name#sha256-}"; hex="${hex%.*}"
              if [ -z "${LIVE[${hex}]:-}" ]; then
                del_sigs+=("${name}")
              else
                kept=$((kept + 1))
              fi
            done < "${tags}"

            for t in "${del_images[@]:-}"; do [ -n "${t}" ] && { del "${repo}" "${t}"; img_del=$((img_del + 1)); }; done
            for t in "${del_sigs[@]:-}";   do [ -n "${t}" ] && { del "${repo}" "${t}"; sig_del=$((sig_del + 1)); }; done

            unset LIVE
            rm -f "${tags}"
            echo "::endgroup::"
          done

          echo "Scanned: ${scanned} | image tags: ${img_del} | signatures: ${sig_del} | kept: ${kept} | dry_run=${DRY_RUN}"
