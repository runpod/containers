name: tmp — inspect image manifests

# Disposable. Delete after the PR run confirms imagetools inspect works on
# ubuntu-latest without docker-setup. Uses the current released version so a
# missing tag is a real registry miss, not "1.1.0 does not exist yet".
on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published canary manifests
        env:
          VERSION: "1.0.7"
        run: |
          set -euo pipefail
          refs=(
            "runpod/base:${VERSION}-ubuntu2204"
            "runpod/pytorch:${VERSION}-cu1281-torch280-ubuntu2204"
            "runpod/pytorch:${VERSION}-cu1281-torch280-ubuntu2204-cluster"
            "runpod/nvidia-pytorch:${VERSION}-25.11"
            "runpod/base:${VERSION}-rocm644-ubuntu2204-py310-pytorch260"
            "runpod/autoresearch:${VERSION}-cuda1281-ubuntu2204"
          )
          missing=0
          for ref in "${refs[@]}"; do
            echo "::group::inspect ${ref}"
            if ! docker buildx imagetools inspect "$ref"; then
              echo "::error::missing image manifest: ${ref}"
              missing=$((missing + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::${missing} expected image(s) for ${VERSION} are not in the registry"
            exit 1
          fi
