name: Reap Leaked Smoke-Test Clusters

# Safety net for Instant Clusters that the cluster smoke test leaks on dev —
# the cluster counterpart of reap-pods.yml. A cancelled run can SIGKILL the
# runner before cluster_runner deletes its cluster, and a leaked cluster bills
# every node. Only clusters named `smoketest-<epoch>-...` are touched; age
# comes from that name (see tests/reap_clusters.py).

on:
  schedule:
    - cron: "30 * * * *" # hourly, offset from reap-pods
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true
      max_age_minutes:
        description: "Delete smoketest-* clusters older than this many minutes"
        type: string
        default: "90"

permissions:
  contents: read

concurrency:
  group: reap-clusters
  cancel-in-progress: false

jobs:
  reap:
    runs-on: ${{ vars.RUNNER_4VCPU_UBUNTU_2404 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Reap stale smoke-test clusters (dev)
        shell: bash
        env:
          RUNPOD_ENV: dev
          RUNPOD_API_KEY: ${{ secrets.DEV_TESTING_RUNPOD_API_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_MAX_AGE: ${{ inputs.max_age_minutes }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNPOD_API_KEY}" ]]; then
            echo "::warning::DEV_TESTING_RUNPOD_API_KEY is not set; nothing to reap"
            exit 0
          fi
          if [ "${EVENT}" = "schedule" ]; then
            DRY_RUN="false"
          else
            DRY_RUN="${INPUT_DRY_RUN:-true}"
          fi
          MAX_AGE_MIN="${INPUT_MAX_AGE:-90}"
          if [[ ! "${MAX_AGE_MIN}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::max_age_minutes must be a positive integer, got '${MAX_AGE_MIN}'"
            exit 1
          fi
          ARGS=(--max-age-minutes "${MAX_AGE_MIN}")
          if [ "${DRY_RUN}" = "false" ]; then
            ARGS+=(--delete)
          fi
          python3 tests/reap_clusters.py "${ARGS[@]}"
