name: k3s Node Image Build

# Reusable building block invoked by the release orchestrator (release.yml),
# which passes in the families it planned. Not triggered on its own — the
# orchestrator owns triggers, concurrency and release.
#
# The k3s node image is not a user template: it runs a k3s agent and carries no
# sshd/nginx/Jupyter, so the pod-based smoke test does not apply. It is verified
# in-container, for both platforms, before the push instead.
on:
  workflow_call:
    inputs:
      families:
        description: >-
          JSON array of families to build, from .github/scripts/plan_families.py.
          A family absent from it keeps its published images and version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.k3s-node.outputs.suffix }}
      k3s-node: ${{ steps.k3s-node.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: k3s-node
        id: k3s-node
        uses: ./.github/actions/compute-version
        with:
          family: k3s-node

  build-k3s-node:
    needs: versions
    if: contains(fromJSON(inputs.families), 'k3s-node')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: ${{ github.repository }}/k3s-node

      # arm64 (GB10/Grace hosts) is built and verified under emulation on this
      # amd64 runner. Registered after Docker Setup: the emulator registered
      # before it was gone by the time the verify step ran its arm64 container
      # ("exec format error"), while the build still passed.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build k3s-node image
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.versions.outputs.k3s-node }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/k3s-node/docker-bake.hcl
          load: true
          push: false

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Verify k3s-node
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          set -euo pipefail
          say() { printf "  %-14s %s\n" "$1" "$2"; }

          IMAGE=$(jq -er '.[] | select(contains("runpod/k3s-node:"))' <<< "$REFS")
          echo "Verifying $IMAGE"
          # The k3s version the bake file pins, so a bump needs no edit here.
          K3S_VERSION=$(sed -n 's/^ *default = "\(v[0-9.]*+k3s[0-9]*\)"/\1/p' official-templates/k3s-node/docker-bake.hcl)
          test -n "$K3S_VERSION"

          # The entrypoint wraps `k3s agent`; the Runpod pod only sets env.
          test "$(docker inspect -f '{{json .Config.Entrypoint}}' "$IMAGE")" = '["/usr/local/bin/k3s-node"]'
          test "$(docker inspect -f '{{json .Config.Cmd}}' "$IMAGE")" = '["agent"]'
          say entrypoint "k3s-node agent"

          for platform in linux/amd64 linux/arm64; do
            echo "$platform"
            docker run --rm --platform "$platform" -e K3S_VERSION="$K3S_VERSION" --entrypoint bash "$IMAGE" -eo pipefail -c '
              say() { printf "  %-14s %s\n" "$1" "$2"; }

              # Same binary for every arch name, so check the machine too.
              say arch "$(uname -m)"

              k3s --version | grep -qF "k3s version ${K3S_VERSION} "
              say k3s "$(k3s --version | head -1 | cut -d" " -f3)"

              # The security minimum k3s does not bundle yet; k3s-node swaps it in.
              /usr/local/lib/k3s-node/runc --version | grep -q "^runc version 1.4.3"
              say runc "$(/usr/local/lib/k3s-node/runc --version | head -1 | cut -d" " -f3)"

              # k3s adds the nvidia containerd runtime when it finds this binary.
              test -x /usr/bin/nvidia-container-runtime
              say nvidia-ctk "$(nvidia-ctk --version | head -1 | grep -o "[0-9.]*$")"

              # The tunnel to the server, and the node password derivation.
              wg --version >/dev/null && ip -V >/dev/null && openssl version >/dev/null
              say tunnel "wireguard-tools, iproute2, openssl"

              # Without K3S_TOKEN the entrypoint waits instead of crash-looping.
              out=$(timeout 3 /usr/local/bin/k3s-node agent 2>&1 || true)
              grep -q "waiting for control plane" <<< "$out"
              say waits "no K3S_TOKEN: sleeps until the control plane exists"
            '
          done

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
