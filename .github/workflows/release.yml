name: Build and Release

# Single orchestrator for image builds + release. It computes the version ONCE
# and passes it to the reusable per-family build workflows (base.yml, nvidia.yml,
# rocm.yml), waits for all of them, and only then — on a releasable push to
# main — tags vX.Y.Z and publishes a GitHub Release.
#
# This replaces the previous decoupled model where every workflow recomputed the
# version independently and release.yml tagged without waiting for the builds
# (so a release could be cut before/despite a failed or missing image family).
on:
  # Directory globs (not individual files) so no build-relevant input — e.g.
  # requirements.txt, pre_start.sh, start.sh — is missed. Pipeline-only (ci:)
  # changes to the workflow/action files intentionally do NOT trigger a build.
  pull_request:
    paths:
      - "official-templates/**"
      - "container-template/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# PR: cancel superseded runs (per ref). Push to main: SERIALIZE — a constant
# group with cancel-in-progress:false makes a 2nd merge wait for the 1st to
# finish (and create its tag), so two merges landing close together can't both
# compute the same next version and race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main-release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which families this event touches, plus everything that builds FROM them.
  # One mechanism for PRs, pushes and manual runs: the family graph.
  plan:
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.p.outputs.families }}
      workflows: ${{ steps.p.outputs.workflows }}
      should-build: ${{ steps.gate.outputs.should-build }}
      should-release: ${{ steps.gate.outputs.should-release }}
      bump: ${{ steps.gate.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          # Deep enough to diff against the base branch / the previous main.
          fetch-depth: 0

      - name: Plan families
        id: p
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          plan() { python3 .github/scripts/plan_families.py "$@"; }
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              RANGE="origin/${GITHUB_BASE_REF}...HEAD"
              ;;
            push)
              # A squash merge is one commit, but a direct push can carry
              # several — planning off HEAD~1 would then miss the earlier ones.
              RANGE="HEAD~1..HEAD"
              if [ -n "${BEFORE}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                RANGE="${BEFORE}..HEAD"
              fi
              ;;
            *)
              # workflow_dispatch has no diff to read.
              RANGE=""
              ;;
          esac
          if [ -z "${RANGE}" ]; then
            FAMILIES="$(plan --all)"
            WORKFLOWS="$(plan --all --workflows)"
          else
            echo "diff range: ${RANGE}"
            git diff --name-only "${RANGE}" > "${RUNNER_TEMP}/changed.txt"
            FAMILIES="$(plan --changed-files "${RUNNER_TEMP}/changed.txt")"
            WORKFLOWS="$(plan --changed-files "${RUNNER_TEMP}/changed.txt" --workflows)"
          fi
          echo "families=${FAMILIES}" >> "$GITHUB_OUTPUT"
          echo "workflows=${WORKFLOWS}" >> "$GITHUB_OUTPUT"

      # Whether this event builds and releases at all, and at which bump
      # level. No family here: both answers come from the event and the
      # squash commit's subject, never from a version.
      - name: Compute gate
        id: gate
        uses: ./.github/actions/compute-version

  # Each build workflow is called only when the plan needs a family it covers,
  # and decides internally which of them to build.
  base:
    needs: plan
    if: >-
      !cancelled() && needs.plan.outputs.should-build == 'true'
      && contains(fromJSON(needs.plan.outputs.workflows), 'base')
    uses: ./.github/workflows/base.yml
    secrets: inherit
    with:
      families: ${{ needs.plan.outputs.families }}

  nvidia:
    needs: plan
    if: >-
      !cancelled() && needs.plan.outputs.should-build == 'true'
      && contains(fromJSON(needs.plan.outputs.workflows), 'nvidia')
    uses: ./.github/workflows/nvidia.yml
    secrets: inherit
    with:
      families: ${{ needs.plan.outputs.families }}

  rocm:
    needs: plan
    if: >-
      !cancelled() && needs.plan.outputs.should-build == 'true'
      && contains(fromJSON(needs.plan.outputs.workflows), 'rocm')
    uses: ./.github/workflows/rocm.yml
    secrets: inherit
    with:
      families: ${{ needs.plan.outputs.families }}

  comfyui:
    needs: plan
    if: >-
      !cancelled() && needs.plan.outputs.should-build == 'true'
      && contains(fromJSON(needs.plan.outputs.workflows), 'comfyui')
    uses: ./.github/workflows/comfyui.yml
    secrets: inherit
    with:
      families: ${{ needs.plan.outputs.families }}
      run-functional-tests: true

  # One tag + GitHub Release per changed family, on a releasable push to main.
  # Each family waits only on its own build: a scan that fails on one image
  # must not keep the others unreleased while their images are already pushed.
  release:
    needs: [plan, base, nvidia, rocm, comfyui]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.plan.result == 'success'
      && needs.plan.outputs.should-release == 'true'
      && needs.plan.outputs.families != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # Independent tags, so one family failing must not hide the others.
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.plan.outputs.families) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      # The job-level `if` can't see `matrix`, so the per-family gate lives
      # here: release this family only if the workflow that builds it passed.
      - name: Check this family's build
        id: gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          WORKFLOW="$(python3 .github/scripts/plan_families.py --workflow "${FAMILY}")"
          RESULT="$(printf '%s' "${RESULTS}" | jq -r --arg w "${WORKFLOW}" '.[$w].result')"
          echo "${FAMILY} is built by '${WORKFLOW}': ${RESULT}"
          if [ "${RESULT}" = "success" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${FAMILY} not released — its build ${RESULT}"
          fi

      - name: Compute version
        id: v
        if: steps.gate.outputs.release == 'true'
        uses: ./.github/actions/compute-version
        with:
          family: ${{ matrix.family }}

      # A releasable push to main is one squash commit, so its extended
      # description is the release body. GitHub's own note generation is NOT
      # used: it compares against the newest release in the repo, which for a
      # per-family tag is some other family's — so we link this family's
      # previous tag ourselves.
      - name: Release body
        id: notes
        if: steps.gate.outputs.release == 'true'
        env:
          FAMILY: ${{ matrix.family }}
          TAG: ${{ steps.v.outputs.tag }}
          PREV_VERSION: ${{ steps.v.outputs.base-version }}
        run: |
          set -euo pipefail
          BODY="${RUNNER_TEMP}/release-body-${FAMILY}.md"
          git log -1 --format=%b HEAD \
            | grep -viE '^(co-authored-by|signed-off-by):' > "${BODY}" || true
          if [ -n "${PREV_VERSION}" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" \
              "${FAMILY}-v${PREV_VERSION}" "${TAG}" >> "${BODY}"
          fi
          echo "path=${BODY}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.gate.outputs.release == 'true'
        run: |
          echo "Released ${{ steps.v.outputs.tag }} (bump ${{ needs.plan.outputs.bump }})"
          echo "Previous: ${{ steps.v.outputs.base-version || 'none — first release' }}"

  # After a real release, sweep aged-out RC/dev tags off Docker Hub. Runs the
  # shared cleanup workflow (not dry-run: workflow_call defaults dry_run=false),
  # so it actually deletes. Age-based retention keeps open PRs' recent RC images.
  cleanup:
    needs: [plan, release]
    if: needs.plan.outputs.should-release == 'true'
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit
