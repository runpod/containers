name: Claude PR Review

# Automatic Claude review on every PR into `develop` (feature/fix) and every
# hotfix PR into `main`. Release PRs (develop -> main) and back-merges
# (main -> develop) are skipped: their commits were already reviewed one by one.
# Advisory only — do NOT add this to the ruleset's required status checks
# (fork and Dependabot PRs skip it, and a skipped required check blocks merge).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, ready_for_review, reopened]

# Comments are posted with this job's GITHUB_TOKEN (as github-actions[bot]):
# scoped to these permissions and this repo, gone when the job ends, and no
# GitHub App install needed.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !(github.base_ref == 'main' && github.head_ref == 'develop') &&
      !(github.base_ref == 'develop' && github.head_ref == 'main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      # The instructions live in .claude/pr-review.md. They are read from the
      # base branch, so a PR cannot rewrite the rules it is reviewed by; the
      # PR's own copy is used only while the base branch does not have the
      # file yet (the PR that adds it). The header above the first `---` is
      # for humans and is dropped.
      - name: Load review instructions
        id: instructions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          file=.claude/pr-review.md
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e "FETCH_HEAD:$file" 2>/dev/null; then
            echo "Using $file from $BASE_REF"
            text="$(git show "FETCH_HEAD:$file")"
          else
            echo "::notice::$file is not on $BASE_REF yet; using the PR's copy"
            text="$(cat "$file")"
          fi
          {
            echo 'text<<__REVIEW_INSTRUCTIONS_EOF__'
            printf '%s\n' "$text" | awk 'body; /^---$/ { body = 1 }'
            echo '__REVIEW_INSTRUCTIONS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Claude review
        uses: anthropics/claude-code-action@5a856893345e332afa621934082d8c660c26d689 # v1.0.282
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            BASE <- HEAD: ${{ github.base_ref }} <- ${{ github.head_ref }}

            ${{ steps.instructions.outputs.text }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
