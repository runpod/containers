name: Claude PR Review

# Automatic Claude review on every PR into `develop` (feature/fix) and every
# hotfix PR into `main`. Release PRs (develop -> main) and back-merges
# (main -> develop) are skipped: their commits were already reviewed one by one.
# Advisory only — do NOT add this to the ruleset's required status checks
# (fork and Dependabot PRs skip it, and a skipped required check blocks merge).
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write   # OIDC exchange for the Claude GitHub App token

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !(github.base_ref == 'main' && github.head_ref == 'develop') &&
      !(github.base_ref == 'develop' && github.head_ref == 'main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@5a856893345e332afa621934082d8c660c26d689 # v1.0.282
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If the Claude GitHub App is NOT installed on runpod/containers,
          # uncomment this; comments then come from github-actions[bot].
          # github_token: ${{ github.token }}
          allow_fork_prs: "false"
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            BASE -> HEAD: ${{ github.base_ref }} <- ${{ github.head_ref }}

            You are reviewing a PR in runpod/containers: Dockerfiles, docker-bake
            files, shell scripts and GitHub workflows that build Runpod's public
            container images. The PR branch is checked out. Read the diff with
            `gh pr diff`, and read surrounding files when you need context.

            Report only real problems, highest impact first:
            1. Correctness: broken builds, wrong bake targets/tags, CUDA/torch/
               Ubuntu version mismatches, scripts that fail under `set -e`,
               startup scripts that break on pods.
            2. Security: secrets or tokens in images or logs, unpinned or
               unverified downloads (missing sha256), services exposed without
               auth, workflows using pull_request_target or untrusted input in
               `run:`.
            3. Image size and layer hygiene: caches left in layers, apt lists
               not cleaned, duplicate installs.
            4. Git flow (docs/RELEASE.md): the PR title must be a Conventional
               Commit and the type must match the change, because it decides the
               release bump: `feat:` minor, `fix:`/`perf:` patch, `feat!:` or
               `BREAKING CHANGE:` major, `ci:`/`chore:`/`docs:`/`refactor:`/
               `test:` no release. Flag a mismatch (e.g. an image change titled
               `chore:` that would never release, or a breaking change titled
               `fix:`). A PR into `main` must come from a `hotfix/*` branch.

            Do not comment on style, naming or formatting nits, and do not
            praise. Post each issue as an inline comment on the exact line with
            mcp__github_inline_comment__create_inline_comment, including a
            concrete fix. Then post ONE short summary with `gh pr comment`:
            verdict, count of issues by severity, and the title/bump check. If
            you find nothing, say so in one line.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
