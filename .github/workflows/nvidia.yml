name: Nvidia Image Build

on:
  pull_request:
    # A pipeline-only (ci:) change to this workflow does not alter image
    # contents, so we don't build/push a confusing RC image for it. Test
    # workflow changes manually via workflow_dispatch instead.
    paths:
      - "official-templates/nvidia-*/**"
      - "official-templates/base/**"
      - "official-templates/shared/**"
      - "container-template/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
      should-build: ${{ steps.v.outputs.should-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: v
        uses: ./.github/actions/compute-version

  build-nvidia:
    needs: version
    if: needs.version.outputs.should-build == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      
      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build nvidia images
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SUFFIX: ${{ needs.version.outputs.suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/nvidia-pytorch/docker-bake.hcl
          load: true
          push: false
      
      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/nvidia-refs
          printf '%s\n' "$REFS" > /tmp/nvidia-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@v7
        with:
          name: nvidia-refs
          path: /tmp/nvidia-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-nvidia:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-nvidia
    if: needs.build-nvidia.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download refs artifact
        uses: actions/download-artifact@v8
        with:
          name: nvidia-refs
          path: /tmp/nvidia-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/nvidia-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          # NGC nvidia-pytorch:25.11 ships torch built against CUDA 13.0
          # and refuses to initialise on hosts whose driver only supports
          # CUDA 12.x (`torch.cuda.is_available() == False` with the message
          # 'NVIDIA driver on your system is too old (found version 12080)').
          # The image tag (`-25.11`) has no embedded CUDA marker, so we
          # have to tell the smoke-test composite action the floor
          # explicitly; it propagates this as `min_cuda_version` in the
          # generated manifest and test_images.py forwards it to
          # `runpodctl --min-cuda-version` so the scheduler avoids
          # 570.x-driver hosts (older L4 / RTX 2000 Ada DCs).
          min-cuda-version: "13.0"
