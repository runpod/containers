name: Nvidia Images Build

# Reusable building block invoked by the release orchestrator (release.yml),
# which passes in the families it planned. Not triggered on its own — the
# orchestrator owns triggers, concurrency and release.
on:
  workflow_call:
    inputs:
      families:
        description: >-
          JSON array of families to build, from .github/scripts/plan_families.py.
          A family absent from it keeps its published images and version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # This family's own version series (git tags `nvidia-pytorch-v1.3.1`).
  versions:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: nvidia-pytorch
        id: v
        uses: ./.github/actions/compute-version
        with:
          family: nvidia-pytorch

  build-nvidia-pytorch:
    needs: versions
    if: contains(fromJSON(inputs.families), 'nvidia-pytorch')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        nvidia: [pytorch2511]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: ${{ github.repository }}/nvidia

      - name: Build nvidia images (${{ matrix.nvidia }})
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.versions.outputs.version }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/nvidia-pytorch/docker-bake.hcl
          load: true
          push: false
          targets: |
            ${{ matrix.nvidia }}

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          fail-on-findings: "true"

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      # Invoked only by the release orchestrator, which has already decided this
      # family should build (per-family path gating lives there), so the build job
      # always runs when reached — no changed-files gate needed (unlike pytorch in
      # base.yml). Always persist this shard's refs for the matching test job.
      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/nvidia-refs
          printf '%s\n' "$REFS" > /tmp/nvidia-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nvidia-refs-${{ matrix.nvidia }}
          path: /tmp/nvidia-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-nvidia-pytorch:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-nvidia-pytorch
    if: needs.build-nvidia-pytorch.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        nvidia: [pytorch2511]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download refs for ${{ matrix.nvidia }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-refs-${{ matrix.nvidia }}
          path: /tmp/nvidia-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/nvidia-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test (${{ matrix.nvidia }})
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          min-cuda-version: "13.0"
