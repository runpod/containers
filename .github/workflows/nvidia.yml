name: Nvidia Images Build

# Reusable building block invoked by the release orchestrator (release.yml),
# which computes the version ONCE and passes it in. Not triggered on its own —
# the orchestrator owns triggers, per-family gating, concurrency and release.
on:
  workflow_call:
    inputs:
      version:
        description: "Semantic version without a leading v (e.g. 1.1.0)."
        required: true
        type: string
      suffix:
        description: "Tag suffix: empty for releases, -rc.<pr> for PRs, -dev otherwise."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-nvidia:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        nvidia: [pytorch2511]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          cache-key: ${{ github.repository }}/nvidia

      - name: Build nvidia images (${{ matrix.nvidia }})
        id: build
        uses: ./.github/actions/bake-retry
        with:
          files: |
            official-templates/shared/versions.hcl
            official-templates/nvidia-pytorch/docker-bake.hcl
          targets: |
            ${{ matrix.nvidia }}
          release-version: ${{ inputs.version }}
          release-suffix: ${{ inputs.suffix }}

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          fail-on-findings: "true"

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      # Invoked only by the release orchestrator, which has already decided this
      # family should build (per-family path gating lives there), so build-nvidia
      # always runs when reached — no changed-files gate needed (unlike pytorch in
      # base.yml). Always persist this shard's refs for the matching test-nvidia.
      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/nvidia-refs
          printf '%s\n' "$REFS" > /tmp/nvidia-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nvidia-refs-${{ matrix.nvidia }}
          path: /tmp/nvidia-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-nvidia:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-nvidia
    if: needs.build-nvidia.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        nvidia: [pytorch2511]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download refs for ${{ matrix.nvidia }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nvidia-refs-${{ matrix.nvidia }}
          path: /tmp/nvidia-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/nvidia-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test (${{ matrix.nvidia }})
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          min-cuda-version: "13.0"
