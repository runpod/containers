name: vLLM Image Build

# Reusable building block invoked by the release orchestrator (release.yml),
# which passes in the families it planned. Not triggered on its own — the
# orchestrator owns triggers, concurrency and release.
#
# No sshd in this image, so the pod smoke test doesn't apply; the auth gate is
# checked on the runner before the push instead.
on:
  workflow_call:
    inputs:
      families:
        description: >-
          JSON array of families to build, from .github/scripts/plan_families.py.
          A family absent from it keeps its published images and version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  versions:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
      should-build: ${{ steps.v.outputs.should-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: vllm
        id: v
        uses: ./.github/actions/compute-version
        with:
          family: vllm

  build-vllm:
    needs: versions
    if: >-
      contains(fromJSON(inputs.families), 'vllm')
      && needs.versions.outputs.should-build == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: ${{ github.repository }}/vllm

      - name: Build vllm image
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.versions.outputs.version }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/vllm/docker-bake.hcl
          load: true
          push: false

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Verify vllm
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          set -euo pipefail
          say() { printf "  %-14s %s\n" "$1" "$2"; }

          IMAGE=$(jq -er '.[] | select(contains("runpod/vllm-openai:"))' <<< "$REFS")
          echo "Verifying $IMAGE"

          test "$(docker inspect -f '{{json .Config.Entrypoint}}' "$IMAGE")" = '["/start.sh"]'
          say entrypoint "/start.sh"

          # No key: vLLM must not start.
          cid=$(docker run -d "$IMAGE" Qwen/Qwen3-0.6B)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            docker logs "$cid" 2>&1 | grep -q 'vLLM was NOT started' && break
            sleep 1
          done
          logs=$(docker logs "$cid" 2>&1)
          grep -q 'vLLM was NOT started: VLLM_API_KEY is not set' <<< "$logs"
          if grep -q 'Starting vLLM' <<< "$logs"; then
            echo "::error::vLLM started without VLLM_API_KEY"
            exit 1
          fi
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true
          say gate "no key: held, vLLM not started"
          docker rm -f "$cid" >/dev/null

          docker run --rm -e VLLM_API_KEY=ci-key \
            -e PYTHONPATH=/opt/runpod/vllm --entrypoint python3 "$IMAGE" -c '
          from fastapi import FastAPI
          from fastapi.testclient import TestClient
          import runpod_vllm_auth

          app = FastAPI()
          for p in ("/health", "/ping", "/metrics", "/invocations", "/tokenize",
                    "/scale_elastic_ep", "/v1/chat/completions"):
              app.add_api_route(p, lambda: {"ok": True}, methods=["GET", "POST"])
          app.add_middleware(runpod_vllm_auth.BearerAuth)
          c = TestClient(app)
          for p in ("/health", "/ping", "/metrics"):
              assert c.get(p).status_code == 200, p
          for p in ("/invocations", "/tokenize", "/scale_elastic_ep", "/v1/chat/completions"):
              assert c.post(p).status_code == 401, p
              assert c.post(p, headers={"Authorization": "Bearer nope"}).status_code == 401, p
              assert c.post(p, headers={"Authorization": "Bearer ci-key"}).status_code == 200, p
          '
          say middleware "401 without the key on /invocations, /tokenize, /v1; probes open"

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}
