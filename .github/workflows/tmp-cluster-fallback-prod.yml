name: TEMP Instant Cluster smoke test with pod fallback

on:
  push:
    branches: [feat/CON-1462-pytorch-cluster-smoke-tests]
  workflow_dispatch:
    inputs:
      image:
        description: pytorch-cluster image to test
        type: string
        default: runpod/pytorch-cluster:2.3.0-rc.212-cu1281-torch2121-ubuntu2404

permissions:
  contents: read

concurrency:
  group: tmp-cluster-fallback-prod
  cancel-in-progress: false

env:
  IMAGE: ${{ inputs.image || 'runpod/pytorch-cluster:2.3.0-rc.212-cu1281-torch2121-ubuntu2404' }}

jobs:
  cluster-smoke-prod:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 90
    env:
      ALLOW_PROD_CLUSTERS: "1"
      CLUSTER_POD_FALLBACK: "1"
    steps:
      - name: Check prod credentials
        shell: bash
        env:
          KEY: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          SSH: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "${KEY}" || -z "${SSH}" ]]; then
            echo "::error::TESTING_RUNPOD_API_KEY / TESTING_RUNPOD_SSH_PRIVATE_KEY are not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Prod cluster catalog
        shell: bash
        working-directory: tests
        env:
          RUNPOD_ENV: prod
          RUNPOD_API_KEY: ${{ secrets.TESTING_RUNPOD_API_KEY }}
        run: |
          python3 - <<'PY'
          from runpod_smoke.cluster import cluster_catalog
          catalog = cluster_catalog() or []
          if not catalog:
              print("::warning::prod cluster catalog is empty (account plan or no capacity)")
          for gpu in catalog:
              node = gpu.price * gpu.sizes[0]
              print(f"{gpu.gpu_id:40s} sizes={gpu.sizes} "
                    f"${gpu.price}/GPU/hr -> ${node:.2f}/node/hr, "
                    f"${2 * node:.2f}/hr for 2 nodes")
          PY

      - name: Instant Cluster smoke test with pod fallback
        uses: ./.github/actions/smoke-test
        with:
          image-refs: '["${{ env.IMAGE }}"]'
          profile: cluster
          runpod-env: prod
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          cluster-nodes: "2"
          cluster-types: "SLURM,TRAINING"
          on-skip: "warn"
          skip-retries: "5"
          skip-retry-delay: "300"
          skip-retry-backoff: "fixed"
          exclude-instances: |
            *GB10*