name: SBOM pilot

on:
  pull_request:
    paths:
      - ".github/actions/sbom/**"
      - ".github/actions/grype/**"
      - ".github/actions/cosign/**"
      - ".github/workflows/base.yml"
      - ".github/workflows/sbom-pilot.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    uses: ./.github/workflows/base.yml
    secrets: inherit
    with:
      families: '["base"]'
