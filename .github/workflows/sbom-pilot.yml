name: SBOM pilot

on:
  # Only PRs into develop: they publish to the private -dev repos. A PR into
  # main would push public release candidates past release.yml's
  # pr-source-gate.
  pull_request:
    branches: [develop]
    paths:
      - ".github/actions/sbom/**"
      - ".github/actions/grype/**"
      - ".github/actions/cosign/**"
      - ".github/workflows/base.yml"
      - ".github/workflows/sbom-pilot.yml"

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    uses: ./.github/workflows/base.yml
    secrets: inherit
    with:
      families: '["base"]'
