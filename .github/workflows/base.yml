name: Base Images Build

# Reusable building block invoked by the release orchestrator (release.yml),
# which passes in the families it planned. Covers the
# base -> pytorch -> {autoresearch, pytorch-cluster} dependency chain; each
# family has its own version series and only the planned ones are built. Not
# triggered on its own (no push/pull_request/concurrency here) — the
# orchestrator owns triggers, gating, concurrency and the final release.
on:
  workflow_call:
    inputs:
      families:
        description: >-
          JSON array of families to build, from .github/scripts/plan_families.py.
          A family absent from it keeps its published images and version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # One version series per family (git tags `base-v1.3.1`, `pytorch-v1.4.0`),
  # all bumped by the same squash commit. The `*-published` outputs are the
  # last RELEASED version of a family — what a dependent layers onto when that
  # family is not rebuilt in this run.
  versions:
    runs-on: ubuntu-latest
    outputs:
      suffix: ${{ steps.base.outputs.suffix }}
      base: ${{ steps.base.outputs.version }}
      base-published: ${{ steps.base.outputs.previous-version }}
      pytorch: ${{ steps.pytorch.outputs.version }}
      pytorch-published: ${{ steps.pytorch.outputs.previous-version }}
      cluster: ${{ steps.cluster.outputs.version }}
      autoresearch: ${{ steps.autoresearch.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: base
        id: base
        uses: ./.github/actions/compute-version
        with:
          family: base

      - name: pytorch
        id: pytorch
        uses: ./.github/actions/compute-version
        with:
          family: pytorch

      - name: pytorch-cluster
        id: cluster
        uses: ./.github/actions/compute-version
        with:
          family: pytorch-cluster

      - name: autoresearch
        id: autoresearch
        uses: ./.github/actions/compute-version
        with:
          family: autoresearch

  build-base:
    needs: versions
    if: contains(fromJSON(inputs.families), 'base')
    runs-on: blacksmith-16vcpu-ubuntu-2204
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: ${{ github.repository }}/base

      - name: Build base images
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.versions.outputs.base }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/base/docker-bake.hcl
          load: true
          push: false

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          fail-on-findings: "true"

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/base-refs
          printf '%s\n' "$REFS" > /tmp/base-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@v7
        with:
          name: base-refs
          path: /tmp/base-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-base:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-base
    if: "!cancelled() && needs.build-base.result == 'success'"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download refs artifact
        uses: actions/download-artifact@v8
        with:
          name: base-refs
          path: /tmp/base-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/base-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: base
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          test-jupyter: true
          on-skip: "warn"
          exclude-instances: |
            RTX 2000 Ada

  build-autoresearch:
    needs: [versions, build-base]
    # Skipped base means base was not planned, so we layer on the published
    # one; failed base means we must not build on it at all.
    if: >-
      !cancelled() && contains(fromJSON(inputs.families), 'autoresearch')
      && (needs.build-base.result == 'success'
          || needs.build-base.result == 'skipped')
    runs-on: blacksmith-16vcpu-ubuntu-2204
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: ${{ github.repository }}/autoresearch

      - name: Build autoresearch images
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.versions.outputs.autoresearch }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
          # Which published runpod/base to build FROM: the in-run base tag
          # when base is part of this build, else the last released base.
          BASE_VERSION: ${{ contains(fromJSON(inputs.families), 'base') && format('{0}{1}', needs.versions.outputs.base, needs.versions.outputs.suffix) || needs.versions.outputs.base-published }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/autoresearch/docker-bake.hcl
          load: true
          push: false

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/autoresearch-refs
          printf '%s\n' "$REFS" > /tmp/autoresearch-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@v7
        with:
          name: autoresearch-refs
          path: /tmp/autoresearch-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-autoresearch:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-autoresearch
    if: "!cancelled() && needs.build-autoresearch.result == 'success'"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download refs artifact
        uses: actions/download-artifact@v8
        with:
          name: autoresearch-refs
          path: /tmp/autoresearch-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/autoresearch-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          exclude-instances: |
            RTX 2000 Ada

  build-pytorch:
    needs: [versions, build-base]
    if: >-
      !cancelled() && contains(fromJSON(inputs.families), 'pytorch')
      && (needs.build-base.result == 'success'
          || needs.build-base.result == 'skipped')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    # The full pytorch matrix (~25 images × multi-GB each) overwhelms the
    # docker-container-driver BuildKit's OCI export pipeline on `load: true`,
    # blowing peak runner disk and stalling the daemon for 15+ minutes until
    # the orchestrator kills the runner. Shard the matrix by CUDA major so
    # each runner only loads 5-10 images at a time onto its own disk.
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu1281, cu1290, cu1300]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          max-parallelism: 6
          cache-key: ${{ github.repository }}/pytorch-${{ matrix.cuda }}-v2

      - name: Build pytorch images (${{ matrix.cuda }})
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          RELEASE_VERSION: ${{ needs.versions.outputs.pytorch }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
          # Which published runpod/base to build FROM: the in-run base tag
          # when base is part of this build, else the last released base.
          BASE_VERSION: ${{ contains(fromJSON(inputs.families), 'base') && format('{0}{1}', needs.versions.outputs.base, needs.versions.outputs.suffix) || needs.versions.outputs.base-published }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/pytorch/docker-bake.hcl
          targets: ${{ matrix.cuda }}
          load: true
          push: false

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          fail-on-findings: "true"

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}
          
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      # Persist this shard's refs so the corresponding test-pytorch matrix
      # entry can pick them up. Artifact name is unique per shard, so the
      # three uploads don't collide.
      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/pytorch-refs
          printf '%s\n' "$REFS" > /tmp/pytorch-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pytorch-refs-${{ matrix.cuda }}
          path: /tmp/pytorch-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-pytorch:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-pytorch
    if: "!cancelled() && needs.build-pytorch.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu1281, cu1290, cu1300]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download refs for ${{ matrix.cuda }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pytorch-refs-${{ matrix.cuda }}
          path: /tmp/pytorch-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/pytorch-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test (${{ matrix.cuda }})
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
          test-jupyter: true
          # Patterns match catalog DISPLAY names, which never contain the
          # word "Blackwell" — only the ids do. Enumerate the cards.
          exclude-instances: |
            B200
            B300
            RTX 5090
            RTX PRO *
            PRO 6000 MIG *
            RTX 2000 Ada
          max-parallel: "4"

  # -cluster layers monitoring + RDMA on top of a PUBLISHED runpod/pytorch.
  # It lives here (not a separate workflow) so it runs AFTER build-pytorch in
  # the same run: on a release it layers on the freshly-pushed pytorch X.Y.Z,
  # and on a PR that changed pytorch it layers on that PR's RC pytorch — so the
  # smoke test reflects the real post-merge combination. A cluster-only PR
  # skips the pytorch rebuild and layers on the last released pytorch instead.
  build-pytorch-cluster:
    needs: [versions, build-pytorch]
    if: >-
      !cancelled() && contains(fromJSON(inputs.families), 'pytorch-cluster')
      && (needs.build-pytorch.result == 'success'
          || needs.build-pytorch.result == 'skipped')
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu1281, cu1290, cu1300]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Docker
        uses: ./.github/actions/docker-setup
        id: setup
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-oidc: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
          cache-key: ${{ github.repository }}/cluster-${{ matrix.cuda }}-v2

      - name: Build cluster images (${{ matrix.cuda }})
        id: build
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          # The cluster's OWN tag: its version + suffix (RC/-dev/release).
          RELEASE_VERSION: ${{ needs.versions.outputs.cluster }}
          RELEASE_SUFFIX: ${{ needs.versions.outputs.suffix }}
          # Which published runpod/pytorch to build FROM: the in-run pytorch
          # tag when pytorch is part of this build, else the last released
          # pytorch — the only one that exists for a cluster-only change.
          PYTORCH_BASE_VERSION: ${{ contains(fromJSON(inputs.families), 'pytorch') && format('{0}{1}', needs.versions.outputs.pytorch, needs.versions.outputs.suffix) || needs.versions.outputs.pytorch-published }}
        with:
          source: .
          files: |
            official-templates/shared/versions.hcl
            official-templates/pytorch-cluster/docker-bake.hcl
          targets: ${{ matrix.cuda }}
          load: true
          push: false

      - name: Extract image refs
        id: refs
        uses: ./.github/actions/image-name
        with:
          bake-metadata: ${{ steps.build.outputs.metadata }}

      - name: Grype scan
        uses: ./.github/actions/grype
        with:
          image-refs: ${{ steps.refs.outputs.refs }}

      - name: Push images
        uses: ./.github/actions/docker-push
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          ref-digests: ${{ steps.refs.outputs.ref-digests }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.6.0

      - name: Cosign sign and verify
        uses: ./.github/actions/cosign
        with:
          image-digests: ${{ steps.refs.outputs.digests }}

      - name: Save refs artifact
        shell: bash
        env:
          REFS: ${{ steps.refs.outputs.refs }}
        run: |
          mkdir -p /tmp/cluster-refs
          printf '%s\n' "$REFS" > /tmp/cluster-refs/refs.json

      - name: Upload refs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cluster-refs-${{ matrix.cuda }}
          path: /tmp/cluster-refs/refs.json
          retention-days: 1
          if-no-files-found: error

  test-pytorch-cluster:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    needs: build-pytorch-cluster
    if: "!cancelled() && needs.build-pytorch-cluster.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        cuda: [cu1281, cu1290, cu1300]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Download refs for ${{ matrix.cuda }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cluster-refs-${{ matrix.cuda }}
          path: /tmp/cluster-refs

      - name: Read refs
        id: refs
        shell: bash
        run: |
          REFS=$(cat /tmp/cluster-refs/refs.json)
          {
            echo "refs<<EOF"
            echo "$REFS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test (${{ matrix.cuda }})
        uses: ./.github/actions/smoke-test
        with:
          image-refs: ${{ steps.refs.outputs.refs }}
          profile: gpu
          runpod-api-key: ${{ secrets.TESTING_RUNPOD_API_KEY }}
          ssh-private-key: ${{ secrets.TESTING_RUNPOD_SSH_PRIVATE_KEY }}
